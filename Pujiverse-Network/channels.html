<script>
// ============================================================
// PUJIVERSE NETWORK — Supabase Service Layer
// Centralises all DB reads/writes + Excel import.
// Falls back to localStorage when Supabase is unavailable.
// ============================================================

const PVDB = (function () {
  let client = null;

  function setClient(c) { client = c; }
  function ready() { return !!client; }

  // ---- generic helpers ----
  async function selectAll(table, opts = {}) {
    if (!client) return { data: lsGet(table), error: null, local: true };
    let q = client.from(table).select('*');
    if (opts.eq) for (const [k, v] of Object.entries(opts.eq)) q = q.eq(k, v);
    if (opts.order) q = q.order(opts.order, { ascending: opts.asc !== false });
    if (opts.limit) q = q.limit(opts.limit);
    const { data, error } = await q;
    if (error) return { data: lsGet(table), error, local: true };
    if (data) lsSet(table, data);
    return { data: data || [], error: null, local: false };
  }

  async function insert(table, rows) {
    if (!client) { lsAppend(table, rows); return { error: null, local: true }; }
    const { data, error } = await client.from(table).insert(rows).select();
    return { data, error, local: false };
  }

  async function upsert(table, rows, onConflict) {
    if (!client) { lsAppend(table, rows); return { error: null, local: true }; }
    const { data, error } = await client.from(table).upsert(rows, onConflict ? { onConflict } : undefined).select();
    return { data, error, local: false };
  }

  async function update(table, id, patch) {
    if (!client) return { error: null, local: true };
    const { data, error } = await client.from(table).update(patch).eq('id', id).select();
    return { data, error };
  }

  async function remove(table, id) {
    if (!client) return { error: null, local: true };
    const { error } = await client.from(table).delete().eq('id', id);
    return { error };
  }

  // ---- localStorage fallback ----
  function lsKey(t) { return 'pvdb_' + t; }
  function lsGet(t) { try { return JSON.parse(localStorage.getItem(lsKey(t)) || '[]'); } catch { return []; } }
  function lsSet(t, arr) { try { localStorage.setItem(lsKey(t), JSON.stringify(arr)); } catch {} }
  function lsAppend(t, rows) {
    const cur = lsGet(t);
    const list = Array.isArray(rows) ? rows : [rows];
    list.forEach(r => cur.push({ id: 'local_' + Math.random().toString(36).slice(2), created_at: new Date().toISOString(), ...r }));
    lsSet(t, cur);
  }

  // ---- Excel import (expects SheetJS `XLSX` global) ----
  // Returns { summary: {table: count}, errors: [] }
  async function importWorkbook(arrayBuffer) {
    if (typeof XLSX === 'undefined') throw new Error('SheetJS (XLSX) not loaded');
    const wb = XLSX.read(arrayBuffer, { type: 'array' });
    const sheetMap = {
      Channels:      { table: 'channels',        conflict: 'sno',
        map: r => ({ sno: s(r.sno), name: s(r.name), handle: s(r.handle), category: s(r.category) }) },
      Videos:        { table: 'videos',
        map: r => ({ channel_sno: s(r.channel_sno), playlist: s(r.playlist), title: s(r.title),
          description: s(r.description), url: s(r.url), status: s(r.status) || 'upcoming',
          scheduled_at: dt(r.scheduled_at), views: n(r.views), likes: n(r.likes),
          comments: n(r.comments), is_popular: b(r.is_popular), thumbnail_url: s(r.thumbnail_url) }) },
      Subscribers:   { table: 'subscribers',
        map: r => ({ channel_sno: s(r.channel_sno), name: s(r.name), email: s(r.email),
          source: s(r.source), joined_at: dt(r.joined_at), is_member: b(r.is_member), notes: s(r.notes) }) },
      Announcements: { table: 'announcements',
        map: r => ({ channel_sno: s(r.channel_sno) || null, title: s(r.title), body: s(r.body),
          link: s(r.link), pinned: b(r.pinned), published_at: dt(r.published_at) }) },
      Posts:         { table: 'posts',
        map: r => ({ channel_sno: s(r.channel_sno) || null, platform: s(r.platform), title: s(r.title),
          body: s(r.body), link: s(r.link), posted_at: dt(r.posted_at) }) },
      Lottery:       { table: 'lottery_entries',
        map: r => ({ channel_sno: s(r.channel_sno), name: s(r.name), email: s(r.email),
          ticket: s(r.ticket), numbers: s(r.numbers), entered_at: dt(r.entered_at),
          is_winner: b(r.is_winner), prize: s(r.prize) }) },
    };
    const summary = {}; const errors = [];
    for (const [sheetName, cfg] of Object.entries(sheetMap)) {
      if (!wb.SheetNames.includes(sheetName)) continue;
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      const clean = rows.map(cfg.map).filter(r => {
        // require a meaningful field
        return r.title || r.name || r.sno || r.email || r.link;
      });
      if (!clean.length) { summary[cfg.table] = 0; continue; }
      let res;
      if (cfg.conflict) res = await upsert(cfg.table, clean, cfg.conflict);
      else res = await insert(cfg.table, clean);
      if (res.error) errors.push(`${sheetName}: ${res.error.message || res.error}`);
      summary[cfg.table] = clean.length;
    }
    return { summary, errors };
  }

  // coercion helpers
  function s(v) { return v == null ? '' : String(v).trim(); }
  function n(v) { const x = Number(v); return isNaN(x) ? 0 : x; }
  function b(v) { return v === true || /^(true|yes|1)$/i.test(String(v).trim()); }
  function dt(v) {
    if (!v) return null;
    if (v instanceof Date) return v.toISOString();
    const d = new Date(v);
    return isNaN(d) ? null : d.toISOString();
  }

  return { setClient, ready, selectAll, insert, upsert, update, remove, importWorkbook, lsGet };
})();

</script>

// --- Helper: Extract YouTube video ID from any YouTube URL ---
function ytId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

}

function StarField() {

    id:i, x: Math.random()*100, y: Math.random()*100,
    s: Math.random()*2+0.5, o: Math.random()*0.6+0.1, d: Math.random()*4+2

  return (
    <div style={{ position:'fixed', inset:0, pointerEvents:'none', zIndex:0, overflow:'hidden' }}>

          animation:`twinkle ${s.d}s ease-in-out infinite alternate`,

// ---------- Rocket cursor (bigger + smoke trail) ----------
function RocketCursor() {
  const ref = React.useRef(null);
  const puffRefs = React.useRef([]);
  const [mode, setMode] = React.useState(() => localStorage.getItem('pv_cursor_mode') || 'cursor');
  React.useEffect(() => {
    try { localStorage.setItem('pv_cursor_mode', mode); } catch(e){}
    document.body.classList.toggle('pv-rocket', mode !== 'cursor');
    return () => document.body.classList.remove('pv-rocket');
  }, [mode]);
  const N = 90; // smoke pool
  const parts = React.useRef(Array.from({ length: N }, () => ({ active: false })));
  const head = React.useRef(0);
  const pos = React.useRef({ x: window.innerWidth / 2, y: window.innerHeight / 2, px: window.innerWidth / 2, py: window.innerHeight / 2, acc: 0, dirx: 0, diry: 1 });

  React.useEffect(() => {
    if (mode === 'cursor') return;
    const el = ref.current;
    let raf;
    const move = (e) => {
      const p = pos.current;
      p.px = p.x; p.py = p.y; p.x = e.clientX; p.y = e.clientY;
    };
    // spawn a smoke puff at the rocket's tail (the cursor point)
    const spawn = (x, y, dirx, diry) => {
      const idx = head.current; head.current = (idx + 1) % N;
      const a = Math.random() * Math.PI * 2;
      parts.current[idx] = {
        active: true,
        x: x + (Math.random() - 0.5) * 3,
        y: y + (Math.random() - 0.5) * 3,
        vx: -dirx * 0.45 + Math.cos(a) * 0.1,
        vy: -diry * 0.45 + Math.sin(a) * 0.1 - 0.05,
        born: performance.now(),
        life: mode === 'rocket' ? 5000 + Math.random() * 4000 : 900 + Math.random() * 900, // rocket smoke lingers 5–9s, sparkles fade fast
        size: mode === 'rocket' ? 6 + Math.random() * 7 : 3 + Math.random() * 4,
      };
    };
    const tick = () => {
      const p = pos.current;
      const dx = p.x - p.px, dy = p.y - p.py;
      const dist = Math.hypot(dx, dy);
      const moving = dist > 0.5;
      let ang = 90;
      if (moving) { ang = Math.atan2(dy, dx) * 180 / Math.PI + 90; p.dirx = dx / dist; p.diry = dy / dist; }
      if (el) el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${ang}deg)`;
      // emit puffs along the path so the trail is continuous
      // trail origin: rocket = flame tip (tail anchored at cursor); satellite/star = behind the body
      const back = mode === 'rocket' ? 4 : 18;
      if (moving) { p.acc += dist; while (p.acc > 7) { p.acc -= 7; spawn(p.x - p.dirx * back, p.y - p.diry * back, p.dirx, p.diry); } }
      // advance + render every puff
      const now = performance.now();
      for (let i = 0; i < N; i++) {
        const s = puffRefs.current[i]; const pt = parts.current[i];
        if (!s) continue;
        if (!pt.active) { s.style.opacity = 0; continue; }
        const age = now - pt.born;
        if (age >= pt.life) { pt.active = false; s.style.opacity = 0; continue; }
        const f = age / pt.life;
        pt.x += pt.vx; pt.y += pt.vy; pt.vx *= 0.985; pt.vy = pt.vy * 0.985 - 0.004;
        const size = pt.size * (1 + f * 2.6);
        s.style.width = size + 'px';
        s.style.height = size + 'px';
        s.style.opacity = (1 - f) * 0.42;
        s.style.transform = `translate(${pt.x}px, ${pt.y}px) translate(-50%,-50%)`;
      }
      raf = requestAnimationFrame(tick);
    };
    window.addEventListener('mousemove', move);
    raf = requestAnimationFrame(tick);
    return () => { window.removeEventListener('mousemove', move); cancelAnimationFrame(raf); };
  }, [mode]);

  // hide on touch devices
  if (typeof window !== 'undefined' && 'ontouchstart' in window) return null;

  const toggle = (
    <div className="pv-cursor-toggle" style={{ position: 'fixed', left: '50%', transform: 'translateX(-50%)', bottom: 14, zIndex: 9999, display: 'flex', gap: 2, background: 'rgba(10,10,22,0.85)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 999, padding: 3, backdropFilter: 'blur(8px)' }}>
      {[['rocket','🚀','Rocket'],['satellite','🛰️','Satellite'],['star','⭐','Flying star'],['cursor','🖱️','Normal cursor']].map(([m, icon, tip]) => (
        <button key={m} onPointerDown={() => setMode(m)} title={tip} style={{
          border: 'none', borderRadius: 999, padding: '8px 13px', fontSize: 16, cursor: 'pointer', lineHeight: 1,
          background: mode === m ? 'rgba(34,211,238,0.22)' : 'transparent',
          outline: mode === m ? '1px solid rgba(34,211,238,0.5)' : 'none'
        }}>{icon}</button>
      ))}
    </div>
  );
  if (mode === 'cursor') return toggle;
  return (
    <React.Fragment>
      {toggle}
      {/* lingering smoke puffs */}
      {Array.from({ length: N }).map((_, i) => (
        <div key={i} ref={el => puffRefs.current[i] = el} style={{
          position: 'fixed', top: 0, left: 0, borderRadius: '50%', pointerEvents: 'none', zIndex: 9997,
          background: mode === 'star' ? 'radial-gradient(circle, rgba(255,240,180,0.95), rgba(251,191,36,0.35) 55%, transparent 75%)' : mode === 'satellite' ? 'radial-gradient(circle, rgba(160,235,255,0.9), rgba(34,211,238,0.3) 55%, transparent 75%)' : 'radial-gradient(circle, rgba(228,231,243,0.85), rgba(178,188,214,0.32) 50%, transparent 72%)',
          filter: mode === 'rocket' ? 'blur(3px)' : 'blur(1px)', opacity: 0, willChange: 'transform,opacity'
        }} />
      ))}
      {/* rocket — tail anchored at the cursor, nose pointing where you move */}
      <div ref={ref} style={{
        position: 'fixed', top: 0, left: 0, width: 0, height: 0,
        pointerEvents: 'none', zIndex: 9999, transition: 'transform 0.04s linear',
      }}>
        <div style={{ transform: mode === 'rocket' ? 'translate(-50%,-92%)' : 'translate(-50%,-50%)' }}>
          {mode === 'rocket' ? (
          <svg width="50" height="50" viewBox="0 0 24 24" style={{ filter: 'drop-shadow(0 0 9px #22d3ee)' }}>
            <path d="M12 1.4c2.8 2.2 4.3 5.7 4.3 9.4 0 1.6-.3 3-.9 4.3L12 21.4l-3.4-6.3c-.6-1.3-.9-2.7-.9-4.3 0-3.7 1.5-7.2 4.3-9.4z" fill="#eef2ff" stroke="#c7d2fe" strokeWidth="0.4"/>
            <circle cx="12" cy="9.4" r="2.1" fill="#0ea5e9"/>
            <circle cx="12" cy="9.4" r="1" fill="#bae6fd"/>
            <path d="M8 13.6l-2.7 3.5 3.3-1.1zM16 13.6l2.7 3.5-3.3-1.1z" fill="#c084fc"/>
            <path d="M10.2 18.5h3.6L12 23z" fill="#fb923c"/>
          </svg>
          ) : (
          <span style={{ fontSize: mode === 'satellite' ? 34 : 38, display: 'inline-block', filter: mode === 'star' ? 'drop-shadow(0 0 10px #fbbf24)' : 'drop-shadow(0 0 8px #22d3ee)' }}>{mode === 'satellite' ? '🛰️' : '⭐'}</span>
          )}
        </div>
      </div>
    </React.Fragment>
  );
}

// ---------- Animated starfield (canvas) ----------
function CosmicCanvas() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const cv = ref.current; if (!cv) return;
    const ctx = cv.getContext('2d');
    let w, h, stars = [], shooters = [], raf;
    const COLORS = ['255,255,255', '190,225,255', '255,225,190', '210,200,255'];
    const resize = () => {
      w = cv.width = window.innerWidth; h = cv.height = window.innerHeight;
      stars = Array.from({ length: Math.min(520, Math.floor(w * h / 3200)) }, () => ({
        x: Math.random() * w, y: Math.random() * h,
        z: Math.random() * 1.8 + 0.3,
        tw: Math.random() * Math.PI * 2,
        sp: 0.6 + Math.random() * 1.8,
        glow: Math.random() < 0.18,
        col: COLORS[Math.floor(Math.random() * COLORS.length)],
        vx: (Math.random() - 0.5) * 0.04,
        vy: 0.02 + Math.random() * 0.05,
      }));
    };
    resize();
    window.addEventListener('resize', resize);

    const spawnShooter = () => {
      shooters.push({
        x: Math.random() * w * 0.7, y: Math.random() * h * 0.4,
        vx: 5 + Math.random() * 5, vy: 2 + Math.random() * 3,
        life: 0, max: 60 + Math.random() * 30, len: 80 + Math.random() * 120,
      });
    };

    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        s.tw += 0.02 * s.sp;
        s.x += s.vx; s.y += s.vy;
        if (s.y > h + 2) { s.y = -2; s.x = Math.random() * w; }
        if (s.x > w + 2) s.x = -2; if (s.x < -2) s.x = w + 2;
        const a = 0.45 + Math.sin(s.tw) * 0.45;
        if (s.glow) { ctx.shadowBlur = 8 + Math.sin(s.tw) * 4; ctx.shadowColor = `rgba(${s.col},0.9)`; }
        else { ctx.shadowBlur = 0; }
        ctx.fillStyle = `rgba(${s.col},${Math.max(0, a) * Math.min(1, s.z)})`;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.z, 0, 7); ctx.fill();
      }
      ctx.shadowBlur = 0;
      if (Math.random() < 0.006 && shooters.length < 3) spawnShooter();
      for (let i = shooters.length - 1; i >= 0; i--) {
        const sh = shooters[i]; sh.life++; sh.x += sh.vx; sh.y += sh.vy;
        const k = 1 - sh.life / sh.max;
        const nx = sh.vx / Math.hypot(sh.vx, sh.vy), ny = sh.vy / Math.hypot(sh.vx, sh.vy);
        const grad = ctx.createLinearGradient(sh.x, sh.y, sh.x - nx * sh.len, sh.y - ny * sh.len);
        grad.addColorStop(0, `rgba(255,255,255,${0.9 * k})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = grad; ctx.lineWidth = 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(sh.x, sh.y); ctx.lineTo(sh.x - nx * sh.len, sh.y - ny * sh.len); ctx.stroke();
        if (sh.life > sh.max || sh.x > w + 50 || sh.y > h + 50) shooters.splice(i, 1);
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); };
  }, []);
  return <canvas ref={ref} style={{ position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none' }} />;
}

              background: 'conic-gradient(from 0deg, rgba(251,146,60,0.0), rgba(251,191,36,0.5), rgba(251,146,60,0.0), rgba(239,68,68,0.45), rgba(251,146,60,0.0), rgba(251,191,36,0.5), rgba(251,146,60,0.0), rgba(239,68,68,0.45), rgba(251,146,60,0.0))',
              filter: 'blur(7px)', animation: 'sunChurn 20s linear infinite, sunFlicker 0.45s steps(3) infinite'
            }} />
            <div style={{ position: 'relative', zIndex: 2, width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Space Grotesk',sans-serif", fontWeight: 900, fontSize: 12, color: '#7c2d12', textAlign: 'center', lineHeight: 1.1, textShadow: '0 0 6px rgba(255,240,200,0.8)' }}>PUJI<br />VERSE</div>
          </div>

          {rings.map((rch, ri) => {
            const radius = 150 + ri * 100;
            const dur = 80 + ri * 26; // seconds per revolution
            return (
              <React.Fragment key={ri}>
                {/* orbit ring */}
                <div style={{
                  position: 'absolute', width: radius * 2, height: radius * 2, left: -radius, top: -radius,
                  border: '1px solid rgba(255,255,255,0.07)', borderRadius: '50%', pointerEvents: 'none'
                }} />
                {/* rotating layer */}
                <div className="pv-orbit" style={{ position: 'absolute', left: 0, top: 0, animation: `pvspin ${dur}s linear infinite` }}>
                  {rch.map((ch, pi) => {
                    const ang = (pi / rch.length) * Math.PI * 2;
                    const x = Math.cos(ang) * radius, y = Math.sin(ang) * radius;
                    return <Planet key={ch.sno} ch={ch} x={x} y={y} counterDur={dur} onClick={() => triggerZoom(ch)} />;
                  })}
                </div>
              </React.Fragment>
            );
          })}
        </div>
      </div>

      {/* EXPLORE — card list of every planet in view */}
      <div style={{ position: 'relative', zIndex: 5, maxWidth: 1100, margin: '0 auto', padding: '10px 24px 110px' }}>
        <h2 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 13, letterSpacing: 3, textTransform: 'uppercase', color: 'rgba(255,255,255,0.45)', fontWeight: 700, margin: '0 0 14px' }}>Explore · {list.length} channels</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(min(100%,240px),1fr))', gap: 12 }}>
          {list.map(ch => {
            const cc = CAT_COLORS[ch.cat] || CAT_COLORS['Education'];
            return (
              <button key={ch.sno} className="pv-explore-card" onClick={() => triggerZoom(ch)} style={{ '--c': cc.accent, display: 'flex', alignItems: 'center', gap: 14, padding: '14px 16px', borderRadius: 14, background: 'rgba(255,255,255,0.035)', border: '1px solid rgba(255,255,255,0.08)', color: '#e8e8f8', cursor: 'pointer', textAlign: 'left', fontFamily: 'inherit', minWidth: 0 }}>
                <span style={{ flex: 'none', width: 42, height: 42, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 19, overflow: 'hidden', background: `radial-gradient(circle at 32% 28%, #ffffffcc, ${cc.accent} 42%, ${cc.badge} 92%)` }}>
                  {ch.logo ? <img src={ch.logo} alt="" style={{ width: '74%', height: '74%', borderRadius: '50%', objectFit: 'cover' }} /> : chIcon(ch)}
                </span>
                <span style={{ minWidth: 0 }}>
                  <b style={{ display: 'block', fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{ch.name}</b>
                  <span style={{ display: 'block', fontSize: 12, color: 'rgba(255,255,255,0.5)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{ch.handle} · {ch.cat}</span>
                </span>
              </button>
            );
          })}
        </div>
        <style>{`.pv-explore-card{transition:border-color .15s,background .15s}.pv-explore-card:hover{background:rgba(255,255,255,0.06)!important;border-color:var(--c)!important}`}</style>
      </div>

      {/* ZOOM-IN OVERLAY */}
      {zoom && (() => {
        const zc = CAT_COLORS[zoom.cat] || CAT_COLORS['Education'];
        return (
          <div style={{ position: 'fixed', inset: 0, zIndex: 9000, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#04040c', animation: 'pvZoomBg .7s ease forwards', overflow: 'hidden' }}>
            <div style={{ animation: 'pvZoomPlanet .72s cubic-bezier(.5,0,.35,1) forwards' }}>
              <div style={{
                width: 170, height: 170, borderRadius: '50%', margin: '0 auto',
                background: `radial-gradient(circle at 32% 28%, #ffffffdd, ${zc.accent} 42%, ${zc.badge} 92%)`,
                boxShadow: `0 0 90px 24px ${zc.accent}cc, inset -12px -12px 30px rgba(0,0,0,0.45)`,
                border: '1px solid rgba(255,255,255,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center'
              }}>
                {zoom.logo ? <img src={zoom.logo} alt="" style={{ width: '74%', height: '74%', borderRadius: '50%', objectFit: 'cover' }}/> : <span style={{ fontSize: 72 }}>{chIcon(zoom)}</span>}
              </div>
            </div>
            <div style={{ position: 'relative', zIndex: 2, marginTop: 26, textAlign: 'center', animation: 'fadeIn .5s ease .15s both' }}>
              <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 800, fontSize: 26, color: '#fff' }}>{zoom.name}</div>
              <div style={{ color: zc.accent, fontSize: 14, marginTop: 4 }}>Entering channel world…</div>
            </div>
          </div>
        );
      })()}

      <style>{`
        @keyframes pvspin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
        @keyframes pvspinrev { from { transform: rotate(0deg);} to { transform: rotate(-360deg);} }
        .pv-orbit:hover { animation-play-state: paused !important; }
        @keyframes pvZoomBg { from { opacity: 0;} to { opacity: 1;} }
        @keyframes pvZoomPlanet { 0% { transform: scale(.35); opacity: 0;} 22% { opacity: 1;} 70% { transform: scale(1.7);} 100% { transform: scale(7); opacity: .15;} }
      `}</style>
    </div>
  );
}

function Planet({ ch, x, y, counterDur, onClick }) {
  const col = CAT_COLORS[ch.cat] || CAT_COLORS['Education'];
  const accent = col.accent;
  const size = 52 + (ch.score - 77) * 0.9; // bigger score => bigger planet
  const [hover, setHover] = React.useState(false);
  const short = ch.name.replace(/^Pujiverse\s*/i, '').replace(/^PUJIVERSE\s*/i, '') || ch.name;
  return (
    <div
      onClick={onClick}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
      style={{ position: 'absolute', left: x, top: y, width: 0, height: 0, cursor: 'pointer', zIndex: hover ? 20 : 4 }}
    >
      {/* counter-rotate so emblem + label stay upright */}
      <div style={{ animation: `pvspinrev ${counterDur}s linear infinite`, position: 'absolute', left: -size / 2, top: -size / 2 }}>
        <div style={{
          width: size, height: size, borderRadius: '50%', position: 'relative',
          background: `radial-gradient(circle at 32% 28%, #ffffffcc, ${accent} 42%, ${col.badge} 92%)`,
          boxShadow: hover ? `0 0 30px 8px ${accent}cc, inset -6px -6px 14px rgba(0,0,0,0.45)` : `0 0 16px 3px ${accent}66, inset -6px -6px 14px rgba(0,0,0,0.4)`,
          border: '1px solid rgba(255,255,255,0.35)', transition: 'box-shadow .2s, transform .2s',
          transform: hover ? 'scale(1.18)' : 'scale(1)',
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>
          {ch.logo
            ? <img src={ch.logo} alt="" style={{ width: '72%', height: '72%', borderRadius: '50%', objectFit: 'cover' }}/>
            : <span style={{ fontSize: size * 0.42, lineHeight: 1, filter: 'drop-shadow(0 1px 2px rgba(0,0,0,0.5))' }}>{chIcon(ch)}</span>}
          {/* glossy highlight */}
          <div style={{ position: 'absolute', top: '12%', left: '18%', width: '30%', height: '22%', borderRadius: '50%', background: 'rgba(255,255,255,0.5)', filter: 'blur(3px)', pointerEvents: 'none' }} />
        </div>
        <div style={{
          position: 'absolute', top: size + 6, left: '50%', transform: 'translateX(-50%)',
          whiteSpace: 'nowrap', fontSize: 12, fontWeight: 700, textAlign: 'center',
          color: hover ? accent : 'rgba(255,255,255,0.8)', pointerEvents: 'none',
          background: 'rgba(7,7,15,0.72)', padding: '2px 8px', borderRadius: 6,
          border: `1px solid ${hover ? accent + '66' : 'transparent'}`
        }}>{short}
          {hover && <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.55)', fontWeight: 500 }}>{ch.handle} · ⭐{ch.score}</div>}
        </div>
      </div>
    </div>
  );
}

// ---------- Channel page (planet zoomed, with moons) ----------
function ChannelWorld({ ch, data, onBack, onOpenPlaylists }) {
  const col = CAT_COLORS[ch.cat] || CAT_COLORS['Education'];
  const accent = col.accent;
  const [moon, setMoon] = React.useState('overview');

  const videos = (data.videos || []).filter(v => v.channel_sno === ch.sno);
  const popular = videos.filter(v => v.is_popular).concat(
    videos.filter(v => !v.is_popular).slice().sort((a, b) => (b.views || 0) - (a.views || 0))
  ).slice(0, 8);
  const recent = videos.filter(v => v.status === 'published').slice().sort((a, b) => new Date(b.scheduled_at || b.created_at || 0) - new Date(a.scheduled_at || a.created_at || 0)).slice(0, 8);
  const upcoming = videos.filter(v => v.status === 'upcoming');
  const anns = (data.announcements || []).filter(a => !a.channel_sno || a.channel_sno === ch.sno);
  const posts = (data.posts || []).filter(p => !p.channel_sno || p.channel_sno === ch.sno);
  const lottery = (data.lottery_entries || []).filter(l => l.channel_sno === ch.sno);

  const moons = [
    { id: 'overview', label: 'Activity', icon: '📡' },
    { id: 'videos', label: 'Videos', icon: '🎬' },
    { id: 'recent', label: 'Recently Uploaded', icon: '🆕' },
    { id: 'popular', label: 'Popular', icon: '🔥' },
    { id: 'posts', label: 'Posts', icon: '📝' },
    { id: 'announcements', label: 'Announcements', icon: '📣' },
    { id: 'lottery', label: 'Lottery', icon: '🎰' },
  ];

  return (
    <div style={{ position: 'relative', minHeight: '100vh', zIndex: 5 }}>
      <style>{`
        @keyframes pvWorldIn { from { transform: scale(1.18);} to { transform: scale(1);} }
        @keyframes pvfloat { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-6px);} }
        .pv-moonstage:hover .pv-moonspin { animation-play-state: paused; }
        .pv-moonbtn:hover { box-shadow: 0 0 20px 5px rgba(255,255,255,0.3) !important; border-color: rgba(255,255,255,0.55) !important; }
      `}</style>
      {/* header */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '20px 28px', flexWrap: 'wrap' }}>
        <button onClick={onBack} style={{
          background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', color: '#e8e8f8',
          borderRadius: 10, padding: '8px 14px', cursor: 'pointer', fontSize: 13
        }}>← Solar system</button>
        <div style={{
          width: 56, height: 56, borderRadius: '50%',
          background: `radial-gradient(circle at 32% 28%, #ffffffcc, ${accent} 42%, ${col.badge})`,
          boxShadow: `0 0 24px 6px ${accent}66`, flexShrink: 0,
          display: 'flex', alignItems: 'center', justifyContent: 'center'
        }}>{ch.logo ? <img src={ch.logo} alt="" style={{ width: '74%', height: '74%', borderRadius: '50%', objectFit: 'cover' }}/> : <span style={{ fontSize: 26 }}>{chIcon(ch)}</span>}</div>
        <div>
          <div style={{ fontFamily: "'Space Grotesk',sans-serif", fontWeight: 800, fontSize: 24 }}>{ch.name}</div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)' }}>{ch.handle} · {ch.cat} · score {ch.score}</div>
        </div>
        <a href={safeUrl(ch.url)} target="_blank" rel="noreferrer" style={{
          marginLeft: 'auto', display: 'inline-flex', alignItems: 'center', gap: 6, padding: '8px 14px',
          background: 'rgba(255,0,0,0.15)', border: '1px solid rgba(255,0,0,0.3)', borderRadius: 10,
          fontSize: 13, color: '#ff6b6b', textDecoration: 'none', fontWeight: 600
        }}>▶ Open on YouTube</a>
      </div>

      {/* PLANET + ORBITING MOONS */}
      <div style={{ display: 'flex', justifyContent: 'center', padding: '4px 20px 4px', animation: 'pvWorldIn .6s cubic-bezier(.2,.7,.3,1) both' }}>
        <div className="pv-moonstage" style={{ position: 'relative', width: 380, height: 380, maxWidth: '94vw' }}>
          {/* orbit ring */}
          <div style={{ position: 'absolute', inset: 40, border: '1px dashed rgba(255,255,255,0.12)', borderRadius: '50%', pointerEvents: 'none' }} />
          {/* central planet */}
          <div style={{
            position: 'absolute', left: '50%', top: '50%', width: 140, height: 140, transform: 'translate(-50%,-50%)',
            borderRadius: '50%', zIndex: 3,
            background: `radial-gradient(circle at 32% 28%, #ffffffcc, ${accent} 42%, ${col.badge} 92%)`,
            boxShadow: `0 0 55px 14px ${accent}88, inset -12px -12px 26px rgba(0,0,0,0.45)`,
            border: '1px solid rgba(255,255,255,0.35)', display: 'flex', alignItems: 'center', justifyContent: 'center'
          }}>
            {ch.logo ? <img src={ch.logo} alt="" style={{ width: '74%', height: '74%', borderRadius: '50%', objectFit: 'cover' }}/> : <span style={{ fontSize: 60 }}>{chIcon(ch)}</span>}
          </div>
          {/* moons (slowly orbiting; hover stage to pause) */}
          <div className="pv-moonspin" style={{ position: 'absolute', inset: 0, animation: 'pvspin 60s linear infinite' }}>
            {moons.map((m, i) => {
              const ang = (i / moons.length) * Math.PI * 2 - Math.PI / 2;
              const R = 158;
              const mx = Math.cos(ang) * R, my = Math.sin(ang) * R;
              const sel = moon === m.id;
              const cnt = moonCount(m.id, { videos, recent, popular, posts, anns, lottery, upcoming });
              return (
                <div key={m.id} style={{ position: 'absolute', left: '50%', top: '50%', transform: `translate(${mx}px, ${my}px)` }}>
                  <div style={{ animation: 'pvspinrev 60s linear infinite' }}>
                    <button className="pv-moonbtn" onClick={() => { setMoon(m.id); setTimeout(() => { const el = document.getElementById('pv-moon-content'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' }); }, 60); }} title={m.label} style={{
                      transform: 'translate(-50%,-50%)', cursor: 'pointer', width: 58, height: 58, borderRadius: '50%',
                      background: sel ? `${accent}33` : 'rgba(18,18,34,0.92)',
                      border: `2px solid ${sel ? accent : 'rgba(255,255,255,0.18)'}`,
                      boxShadow: sel ? `0 0 22px 5px ${accent}99` : '0 2px 10px rgba(0,0,0,0.45)',
                      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 0, transition: 'all .15s'
                    }}>
                      <span style={{ fontSize: 19, lineHeight: 1.1 }}>{m.icon}</span>
                      <span style={{ fontSize: 9, fontWeight: 800, color: sel ? accent : 'rgba(255,255,255,0.55)' }}>{(cnt || '').replace('· ', '')}</span>
                    </button>
                    <div style={{ position: 'absolute', top: 34, left: '50%', transform: 'translateX(-50%)', whiteSpace: 'nowrap', fontSize: 10, fontWeight: 700, color: sel ? accent : 'rgba(255,255,255,0.5)', pointerEvents: 'none', textShadow: '0 1px 3px #04040c' }}>{m.label}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{ textAlign: 'center', marginTop: 2, marginBottom: 14, fontSize: 12, color: 'rgba(255,255,255,0.4)' }}>
        Hover to pause · tap a moon to open › <b style={{ color: accent }}>{(moons.find(m => m.id === moon) || {}).label}</b>
      </div>

      {/* content panel — the actual items of the selected moon */}
      <div id="pv-moon-content" style={{ padding: '0 28px 80px', animation: 'fadeIn .3s ease' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 16, borderBottom: `1px solid ${accent}33`, paddingBottom: 10 }}>
          <span style={{ fontSize: 22 }}>{(moons.find(m => m.id === moon) || {}).icon}</span>
          <span style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 800, color: '#f0f0f8' }}>{(moons.find(m => m.id === moon) || {}).label}</span>
          <span style={{ fontSize: 13, color: accent, fontWeight: 700 }}>{(moonCount(moon, { videos, recent, popular, posts, anns, lottery, upcoming }) || '').replace('· ', '') && `${(moonCount(moon, { videos, recent, popular, posts, anns, lottery, upcoming }) || '').replace('· ', '')} item(s)`}</span>
        </div>
        {moon === 'overview' && <ChannelOverview ch={ch} accent={accent} videos={videos} upcoming={upcoming} anns={anns} posts={posts} lottery={lottery} onOpenPlaylists={onOpenPlaylists} />}
        {moon === 'videos' && <VideoGrid videos={videos} accent={accent} empty="No videos imported yet. Add them in the Excel workbook." />}
        {moon === 'recent' && <VideoGrid videos={recent} accent={accent} empty="No recently uploaded videos." />}
        {moon === 'popular' && <VideoGrid videos={popular} accent={accent} empty="No popular videos flagged. Set is_popular=TRUE in Excel." />}
        {moon === 'posts' && <PostList posts={posts} accent={accent} />}
        {moon === 'announcements' && <AnnList anns={anns} accent={accent} />}
        {moon === 'lottery' && <LotteryPanel entries={lottery} accent={accent} />}
      </div>
    </div>
  );
}

function moonCount(id, d) {
  const m = { overview: '', videos: d.videos.length, recent: d.recent.length, popular: d.popular.length, posts: d.posts.length, announcements: d.anns.length, lottery: d.lottery.length };
  return m[id] === '' ? '' : `· ${m[id]}`;
}

function Card({ children, accent, style }) {
  return <div style={{ background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 16, padding: 18, ...style }}>{children}</div>;
}

function Stat({ label, value, accent }) {
  return (
    <Card accent={accent} style={{ flex: '1 1 140px', minWidth: 140 }}>
      <div style={{ fontSize: 26, fontWeight: 800, fontFamily: "'Space Grotesk',sans-serif", color: accent }}>{value}</div>
      <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.5)', textTransform: 'uppercase', letterSpacing: 1, marginTop: 4 }}>{label}</div>
    </Card>
  );
}

function ChannelOverview({ ch, accent, videos, upcoming, anns, posts, lottery, onOpenPlaylists }) {
  const totalViews = videos.reduce((s, v) => s + (v.views || 0), 0);
  const topPl = analyzePlaylists(ch, videos);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
      {/* stats */}
      <div style={{ display: 'flex', gap: 14, flexWrap: 'wrap' }}>
        <Stat label="Videos" value={videos.length} accent={accent} />
        <Stat label="Total views" value={fmt(totalViews)} accent={accent} />
        <Stat label="Upcoming" value={upcoming.length} accent={accent} />
        <Stat label="Posts" value={posts.length} accent={accent} />
        <Stat label="Lottery entries" value={lottery.length} accent={accent} />
        <Stat label="Playlists" value={ch.playlists.length} accent={accent} />
      </div>

      {/* popular content analysis */}
      <Card accent={accent}>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12, display: 'flex', alignItems: 'center', gap: 8 }}>🔥 Popular content analysis</div>
        {topPl.length === 0 ? (
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.45)' }}>Import videos with view counts to unlock analysis. Showing channel playlists:
            <div style={{ marginTop: 10, display: 'flex', flexWrap: 'wrap', gap: 8 }}>
              {ch.playlists.map((p, i) => (
                <span key={i} style={{ fontSize: 12, padding: '6px 10px', background: 'rgba(255,255,255,0.05)', borderRadius: 8, border: '1px solid rgba(255,255,255,0.08)' }}>{p}</span>
              ))}
            </div>
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {topPl.map((p, i) => (
              <div key={i}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 4 }}>
                  <span>{p.name}</span><span style={{ color: accent }}>{fmt(p.views)} views · {p.count} videos</span>
                </div>
                <div style={{ height: 8, background: 'rgba(255,255,255,0.06)', borderRadius: 4, overflow: 'hidden' }}>
                  <div style={{ height: '100%', width: `${p.pct}%`, background: `linear-gradient(90deg,${accent},${accent}66)` }} />
                </div>
              </div>
            ))}
          </div>
        )}
        <button onClick={() => onOpenPlaylists(ch)} style={{ marginTop: 14, background: `${accent}22`, border: `1px solid ${accent}`, color: accent, borderRadius: 10, padding: '8px 14px', cursor: 'pointer', fontSize: 13, fontWeight: 600 }}>Browse all playlists →</button>
      </Card>

      {anns.length > 0 && (
        <Card accent={accent}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12 }}>📣 Latest announcement</div>
          <div style={{ fontWeight: 600 }}>{anns[0].title}</div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.6)', marginTop: 6 }}>{anns[0].body}</div>
        </Card>
      )}
    </div>
  );
}

function analyzePlaylists(ch, videos) {
  if (!videos.length) return [];
  const map = {};
  videos.forEach(v => { const k = v.playlist || 'Other'; map[k] = map[k] || { name: k, views: 0, count: 0 }; map[k].views += v.views || 0; map[k].count++; });
  const arr = Object.values(map).sort((a, b) => b.views - a.views);
  const max = Math.max(...arr.map(a => a.views), 1);
  arr.forEach(a => a.pct = Math.round(a.views / max * 100));
  return arr.slice(0, 5);
}

function VideoGrid({ videos, accent, empty }) {
  if (!videos || !videos.length) return <Empty msg={empty || 'Nothing here yet.'} />;
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(260px,1fr))', gap: 16 }}>
      {videos.map((v, i) => (
        <Card key={v.id || i} accent={accent} style={{ padding: 0, overflow: 'hidden' }}>
          <div style={{ aspectRatio: '16/9', background: `linear-gradient(135deg,${accent}33,#1a1a2e)`, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
            <span style={{ fontSize: 30 }}>{v.status === 'upcoming' ? '⏳' : '▶'}</span>
            {v.is_popular && <span style={{ position: 'absolute', top: 8, right: 8, fontSize: 11, padding: '2px 7px', background: '#f97316', borderRadius: 6, fontWeight: 700 }}>🔥 POPULAR</span>}
          </div>

// ---- formatting helpers ----
// Block dangerous URL schemes (javascript:, data:, etc.) before putting any
// data-supplied value into an href. Returns '#' for anything not http(s)/mailto.
function safeUrl(u) {
  if (!u) return '#';
  const s = String(u).trim();
  if (/^(https?:|mailto:|tel:)/i.test(s)) return s;
  if (/^(\/|\.|#)/.test(s)) return s;                 // relative links are fine
  if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return '#';      // any other scheme -> blocked
  return 'https://' + s;                               // bare domain -> assume https
}
function fmt(n) { n = Number(n) || 0; if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B'; if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M'; if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K'; return String(n); }
function fmtDate(d) { if (!d) return '—'; const x = new Date(d); return isNaN(x) ? '—' : x.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }

// Rule-based fallback brain — knows the whole site structure. Replies are strings
// or { text, action:'hub' } (the chat renders a button that opens the Hub view).
function localBrain(q, data) {
  const t = (q || '').toLowerCase();
  const chans = (data.channels && data.channels.length ? data.channels : CHANNELS);

  // contact / business enquiries
  if (/contact|e-?mail|gmail|reach (you|out|him)|business|collab|sponsor|partner|hire|talk to|get in touch/.test(t))
    return { text: "You can reach Pujiverse directly at\n\n\ud83d\udce7 pujiverse@gmail.com\n\nFor the fastest reply, connect on social media — the Hub has every platform we're on. Tap below! \ud83d\ude80", action: 'hub' };

  // greeting
  if (/^(hi|hey|hello|yo|namaste|hola)\b/.test(t))
    return `Hey! \ud83e\ude90 I'm the Pujiverse assistant. I know this whole galaxy — ${chans.length} channels, the lottery, socials and how everything works. Try "find me space videos", "what categories do you have" or "how do I contact you".`;

  // how the site works / structure / navigation
  if (/how (do|does|to).*(site|navigate|use|work)|what is (this|pujiverse)|structure|which views|solar (system|view)|planets?\b|moons?\b/.test(t))
    return `Here's how Pujiverse works:\n\ud83e\ude90 Solar view — every planet is one of our ${chans.length} YouTube channels orbiting the Pujiverse sun. Click a planet to zoom into its world; its moons hold Videos, Recently Uploaded, Popular, Posts, Announcements and Lottery.\n\ud83d\udef0 Hub — all our social media links, announcements and posts.\n\ud83d\udcc7 Grid view — the classic list of every channel.\n\ud83c\udfb0 Lottery — live subscriber draws (the button just above me).\nSwitch views bottom-left · change your cursor (\ud83d\ude80\ud83d\udef0\ufe0f\u2b50\ud83d\uddb1\ufe0f) bottom-center.`;

  // lottery
  if (/lottery|lucky|draw|winner|ticket/.test(t)) {
    const entries = data.lottery_entries || [];
    const winners = entries.filter(e => e.is_winner).length;
    return `\ud83c\udfb0 Our lottery runs live subscriber draws per channel${entries.length ? ` — currently ${entries.length} entries${winners ? `, ${winners} winner(s)` : ''}` : ''}. Open it from the \ud83c\udfb0 Lottery button (above me) or any channel's Lottery moon. Winners are drawn live with a spinning reveal!`;
  }

  // social / where to follow — offer the Hub
  if (/follow|social|instagram|twitter|tiktok|discord|facebook|youtube channel|where.*find|links?|connect/.test(t)) {
    const socials = (data.social && data.social.length ? data.social : SOCIAL_LINKS);
    const top = socials.slice(0, 6).map(s => `${s.platform}: ${s.handle || s.url}`).join('\n');
    return { text: `Here's where to follow Pujiverse:\n${top}\n…and more in the Hub — tap below to connect with me. \ud83d\ude80`, action: 'hub' };
  }

  // categories / galaxies
  if (/categor|galax|genre|kinds? of channel|types? of channel/.test(t)) {
    const counts = {};
    chans.forEach(c => { counts[c.cat] = (counts[c.cat] || 0) + 1; });
    return `Our galaxies (categories):\n` + Object.entries(counts).map(([c, n]) => `• ${c} — ${n} channel${n > 1 ? 's' : ''}`).join('\n') + `\n\nTell me a topic and I'll point you to the right planet!`;
  }

  // admin / editing questions
  if (/admin|password|log ?in|edit|upload|change data/.test(t))
    return `The admin panel is private — only the Pujiverse owner can log in and edit. Everything you see (channels, videos, lottery) is read-only for visitors. \ud83d\udd12 Need something? Email \ud83d\udce7 pujiverse@gmail.com`;

  // exact channel lookup by name/handle
  const named = chans.find(c => t.includes(c.name.toLowerCase()) || (c.handle && t.includes(c.handle.toLowerCase().replace('@', ''))));
  if (named)
    return `\ud83d\udcfa ${named.name} (${named.handle}) — ${named.cat}\n\u2b50 Viral score ${named.score} · ${named.status}\nPlaylists: ${(named.playlists || []).slice(0, 5).join(', ') || '—'}\nWatch: ${named.url}\n\nOr click its planet in the solar system to explore its videos, posts and lottery moon.`;

  // recommend by topic — match channel categories/names/playlists
  const matches = chans.filter(c => {
    const blob = (c.name + ' ' + c.cat + ' ' + (c.playlists || []).join(' ')).toLowerCase();
    return t.split(/\s+/).filter(w => w.length > 3).some(w => blob.includes(w));
  }).slice(0, 4);
  if (matches.length) {
    return `Based on that, check out:\n` + matches.map(c => `• ${c.name} (${c.cat}) — ${c.url}`).join('\n') + `\n\nClick its planet in the solar system to explore videos, popular content and posts.`;
  }

  // count / list
  if (/how many|number of|count/.test(t) && /channel/.test(t))
    return `Pujiverse Network runs ${chans.length} channels across categories like Science & Tech, Entertainment, Education, Gaming, Finance and more. \ud83c\udf0c`;

    return `I can: recommend a channel for any topic, explain how the site works, share contact info and social links, and explain the lottery. Try "I want crypto videos", "how do I contact you" or "take me to your socials".`;

  return `I can help you navigate Pujiverse's ${chans.length} channels, find videos on a topic, share contact info (\ud83d\udce7 pujiverse@gmail.com), social links, or explain the lottery. What are you into — tech, mystery, finance, gaming, something else?`;

  async function logMessage(role, content) {
    try {
      if (supabase) await supabase.from('messages').insert({ session_id: sessionId(), role, content });
    } catch {}
  }

  async function askAgent(question) {
    // Try edge function first
    if (supabaseUrl) {
      try {
        const fnUrl = supabaseUrl.replace(/\/$/, '') + '/functions/v1/chat-agent';
        const res = await fetch(fnUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, session_id: sessionId() }),
        });
        if (res.ok) {
          const j = await res.json();
          if (j && j.reply) return j.reply;
        }
      } catch (e) { /* fall through to local brain */ }
    }
    return localBrain(question, data);

// ---------- Excel Import tab ----------
function ImportTab({ supabase, onDataChanged }) {
  const [log, setLog] = React.useState([]);
  const [busy, setBusy] = React.useState(false);
  const fileRef = React.useRef(null);
  const add = (msg, ok = true) => setLog(l => [...l, { msg, ok, t: Date.now() }]);

  React.useEffect(() => { if (supabase) PVDB.setClient(supabase); }, [supabase]);

  async function handleFile(e) {
    const f = e.target.files?.[0];
    if (!f) return;
    setBusy(true); setLog([]);
    add(`Reading "${f.name}"…`);
    try {
      const buf = await f.arrayBuffer();
      if (supabase) PVDB.setClient(supabase);
      const { summary, errors } = await PVDB.importWorkbook(buf);
      Object.entries(summary).forEach(([t, n]) => add(`✓ ${t}: ${n} rows ${supabase ? 'pushed to Supabase' : 'saved locally'}`));
      errors.forEach(er => add('✗ ' + er, false));
      if (!Object.keys(summary).length) add('No matching sheets found. Use the provided template.', false);
      add('Done. ' + (supabase ? 'Data is live.' : 'Connect Supabase to make it permanent.'));
      onDataChanged && onDataChanged();
    } catch (err) {
      add('✗ ' + (err.message || err), false);
    } finally {
      setBusy(false);
      if (fileRef.current) fileRef.current.value = '';
    }
  }

  return (
    <div>
      <h3 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 800, margin: '0 0 6px' }}>📥 Import from Excel</h3>
      <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 13, margin: '0 0 20px' }}>
        Upload <b>PujiverseNetwork_Data.xlsx</b>. Each tab (Videos, Subscribers, Announcements, Posts, Lottery, Channels) is pushed to its matching Supabase table. Videos &amp; channels are upserted (no duplicates); the rest are appended.
      </p>

      <div style={{ border: '2px dashed rgba(34,211,238,0.4)', borderRadius: 16, padding: 36, textAlign: 'center', background: 'rgba(34,211,238,0.04)' }}>
        <div style={{ fontSize: 40, marginBottom: 10 }}>📊</div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls" onChange={handleFile} style={{ display: 'none' }} id="pv-xlsx-input" />
        <label htmlFor="pv-xlsx-input" style={{
          display: 'inline-block', padding: '12px 22px', borderRadius: 12, cursor: busy ? 'wait' : 'pointer',
          background: 'linear-gradient(135deg,#22d3ee,#c084fc)', color: '#0a0a15', fontWeight: 700
        }}>{busy ? 'Importing…' : 'Choose Excel file'}</label>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginTop: 12 }}>
          {supabase ? '● Connected to Supabase — data will persist' : '○ Not connected — data saved in browser only (connect in ⚙ Supabase tab)'}
        </div>
      </div>

      {log.length > 0 && (
        <div style={{ marginTop: 20, background: 'rgba(0,0,0,0.3)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 12, padding: 16, fontFamily: 'monospace', fontSize: 12.5, maxHeight: 260, overflowY: 'auto' }}>
          {log.map((l, i) => <div key={i} style={{ color: l.ok ? '#4ade80' : '#f87171', padding: '2px 0' }}>{l.msg}</div>)}
        </div>
      )}
    </div>
  );
}

function SearchTab({ supabase }) {
  const [q, setQ] = React.useState('');
  const [scope, setScope] = React.useState('videos');
  const [rows, setRows] = React.useState([]);
  const [busy, setBusy] = React.useState(false);
  const [count, setCount] = React.useState(null);

  const scopes = [
    { id: 'videos', label: '🎬 Videos', cols: ['title', 'channel_sno', 'playlist', 'status', 'views', 'url'], search: ['title', 'description', 'playlist'] },
    { id: 'subscribers', label: '👥 Subscribers', cols: ['name', 'email', 'channel_sno', 'source', 'is_member'], search: ['name', 'email', 'source'] },
    { id: 'lottery_entries', label: '🎰 Lottery', cols: ['name', 'email', 'ticket', 'numbers', 'channel_sno', 'is_winner'], search: ['name', 'email', 'ticket'] },
    { id: 'announcements', label: '📣 Announcements', cols: ['title', 'channel_sno', 'published_at'], search: ['title', 'body'] },
    { id: 'posts', label: '📝 Posts', cols: ['title', 'platform', 'channel_sno', 'link'], search: ['title', 'body'] },
  ];
  const cfg = scopes.find(s => s.id === scope);

  React.useEffect(() => { if (supabase) PVDB.setClient(supabase); }, [supabase]);

  async function run() {
    setBusy(true);
    try {
      if (supabase) {
        let query = supabase.from(scope).select('*', { count: 'exact' });
        if (q.trim()) {
          const term = q.trim().replace(/[%,]/g, '');
          const ors = cfg.search.map(c => `${c}.ilike.%${term}%`).join(',');
          query = query.or(ors);
        }
        query = query.limit(200);
        const { data, error, count } = await query;
        if (error) { setRows([{ _err: error.message }]); setCount(null); }
        else { setRows(data || []); setCount(count); }
      } else {
        const all = PVDB.lsGet(scope);
        const t = q.trim().toLowerCase();
        const filtered = t ? all.filter(r => cfg.search.some(c => String(r[c] || '').toLowerCase().includes(t))) : all;
        setRows(filtered.slice(0, 200)); setCount(filtered.length);
      }
    } finally { setBusy(false); }
  }

  React.useEffect(() => { run(); /* eslint-disable-next-line */ }, [scope]);

  return (
    <div>
      <h3 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 800, margin: '0 0 6px' }}>🔎 Search all data</h3>
      <p style={{ color: 'rgba(255,255,255,0.45)', fontSize: 13, margin: '0 0 18px' }}>Find any row fast — even across tens of thousands of records. Searches Supabase directly when connected.</p>

      <div style={{ display: 'flex', gap: 10, marginBottom: 14, flexWrap: 'wrap' }}>
        <select value={scope} onChange={e => setScope(e.target.value)} style={inp(160)}>
          {scopes.map(s => <option key={s.id} value={s.id} style={{ background: '#0e0e1a' }}>{s.label}</option>)}
        </select>
        <input value={q} onChange={e => setQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && run()} placeholder="Type to search… (title, name, email, ticket)" style={{ ...inp(0), flex: 1, minWidth: 220 }} />
        <button onClick={run} style={{ padding: '0 20px', borderRadius: 10, border: 'none', cursor: 'pointer', fontWeight: 700, background: 'linear-gradient(135deg,#22d3ee,#c084fc)', color: '#0a0a15' }}>Search</button>
      </div>

      <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginBottom: 10 }}>
        {busy ? 'Searching…' : count != null ? `${count} match${count === 1 ? '' : 'es'}${rows.length < count ? ` (showing first ${rows.length})` : ''}` : ''}
      </div>

      <div style={{ overflowX: 'auto', background: 'rgba(255,255,255,0.02)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 12 }}>
        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 13 }}>
          <thead><tr style={{ background: 'rgba(255,255,255,0.05)' }}>
            {cfg.cols.map(c => <th key={c} style={{ textAlign: 'left', padding: '10px 14px', color: 'rgba(255,255,255,0.55)', fontWeight: 600, whiteSpace: 'nowrap' }}>{c}</th>)}
          </tr></thead>
          <tbody>
            {rows.length === 0 && <tr><td colSpan={cfg.cols.length} style={{ padding: 24, textAlign: 'center', color: 'rgba(255,255,255,0.35)' }}>No results.</td></tr>}
            {rows.map((r, i) => r._err ? (
              <tr key={i}><td colSpan={cfg.cols.length} style={{ padding: 14, color: '#f87171' }}>{r._err} — did you run schema.sql?</td></tr>
            ) : (
              <tr key={r.id || i} style={{ borderTop: '1px solid rgba(255,255,255,0.06)' }}>
                {cfg.cols.map(c => (
                  <td key={c} style={{ padding: '9px 14px', maxWidth: 320, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                    {c === 'url' || c === 'link' ? (r[c] ? <a href={safeUrl(r[c])} target="_blank" rel="noreferrer" style={{ color: '#22d3ee' }}>open</a> : '—') : String(r[c] ?? '—')}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );

  function inp(w) { return { padding: '10px 14px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 10, color: '#e8e8f8', fontSize: 14, outline: 'none', width: w || undefined }; }
}

const ADMIN_USER = "pujiversenetwork";
// Password is no longer stored in the page. We keep only a salted SHA-256 hash,
// so reading the source does not reveal the password.
const ADMIN_SALT = "pv-salt-2026::";
const ADMIN_PASS_HASH = "593e02a8be2c22a03723d49e471849e4462b1fb099fce65348cf97b7c5ca073c";
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function verifyAdminPass(pass) {
  try { return (await sha256Hex(ADMIN_SALT + pass)) === ADMIN_PASS_HASH; }
  catch { return false; }
}

function ABtn({ children, onClick, variant="primary", size="md", style={} }) {
  const base = { cursor:'pointer', fontFamily:'Inter,sans-serif', fontWeight:600, border:'none', borderRadius:10, transition:'all 0.15s', ...style };
  const sz = size==="sm" ? { padding:'6px 12px', fontSize:12 } : { padding:'10px 18px', fontSize:14 };
  const col = variant==="primary" ? { background:'linear-gradient(135deg,#22d3ee,#c084fc)', color:'#0a0a15' }
            : variant==="danger"  ? { background:'rgba(239,68,68,0.2)', color:'#f87171', border:'1px solid rgba(239,68,68,0.3)' }
            : variant==="ghost"   ? { background:'rgba(255,255,255,0.05)', color:'rgba(255,255,255,0.6)', border:'1px solid rgba(255,255,255,0.1)' }
            :                       { background:'rgba(255,255,255,0.08)', color:'#e8e8f8', border:'1px solid rgba(255,255,255,0.12)' };
  return <button onClick={onClick} style={{...base,...sz,...col}}>{children}</button>;
}

// ---- LOGIN MODAL ----
function LoginModal({ onLogin, onClose, supabase }) {
  const tokenRef = React.useRef('');
  const [cloud, setCloud] = React.useState('');
  const [user, setUser] = React.useState('');
  const [pass, setPass] = React.useState('');
  const [err, setErr] = React.useState('');
  const [step, setStep] = React.useState(1); // 1=credentials, 2=verify
  const [checking, setChecking] = React.useState(false);

  const handleLogin = async () => {
    if (checking) return;
    setChecking(true);
    const ok = (user.trim().toLowerCase() === ADMIN_USER) && await verifyAdminPass(pass);
    setChecking(false);
    if (!ok) { setErr('Invalid credentials. Try again.'); return; }
    setErr('');
    tokenRef.current = await sha256Hex(ADMIN_SALT + pass + '::session');
    // the same password also signs in to Supabase Auth, which is what really protects the database
    if (supabase && navigator.onLine) {
      setChecking(true);
      try {
        const { error } = await supabase.auth.signInWithPassword({ email: 'pujiverse@gmail.com', password: pass });
        if (error) setCloud('⚠ Cloud login failed (' + error.message + '). Changes save on this device only. Create the Supabase user pujiverse@gmail.com with this same password, or use ☁ Cloud login in the panel.');
        else { const { data: isAdm } = await supabase.rpc('is_admin'); setCloud(isAdm ? '☁ Cloud writes enabled' : '⚠ Signed in to Supabase, but this email is not in admin_users.'); }
      } catch (e) { setCloud('⚠ Could not reach Supabase. Changes save on this device only.'); }
      setChecking(false);
    } else setCloud('Offline: changes save on this device only.');
    setStep(2);
  };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.9)', zIndex:9000, display:'flex', alignItems:'center', justifyContent:'center', backdropFilter:'blur(12px)' }}>
      <div style={{ background:'#0e0e1a', border:'1px solid rgba(255,255,255,0.12)', borderRadius:24, padding:40, width:'100%', maxWidth:400 }}>
        {step === 1 && <>
          <div style={{ textAlign:'center', marginBottom:28 }}>
            <div style={{ fontSize:32, marginBottom:8 }}>🔐</div>
            <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:800, color:'#f0f0f8', margin:'0 0 6px' }}>Admin Access</h2>
            <p style={{ color:'rgba(255,255,255,0.35)', fontSize:13, margin:0 }}>Private panel — authorized personnel only</p>
          </div>
          <div style={{ display:'flex', flexDirection:'column', gap:16, marginBottom:20 }}>
            <AInput label="Username" value={user} onChange={setUser} placeholder="Enter username" />
            <AInput label="Password" value={pass} onChange={setPass} type="password" placeholder="Enter password" />
          </div>
          {err && <div style={{ padding:'10px 14px', background:'rgba(239,68,68,0.1)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:10, color:'#f87171', fontSize:13, marginBottom:16 }}>{err}</div>}
          <div style={{ display:'flex', gap:10 }}>
            <ABtn onClick={handleLogin} variant="primary" style={{ flex:1 }} onKeyDown={e=>e.key==='Enter'&&handleLogin()}>{checking ? 'Checking…' : 'Continue →'}</ABtn>
            <ABtn onClick={onClose} variant="ghost">Cancel</ABtn>
          </div>
        </>}

        {step === 2 && <>
          <div style={{ textAlign:'center', marginBottom:28 }}>
            <div style={{ fontSize:32, marginBottom:8 }}>✅</div>
            <h2 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:22, fontWeight:800, color:'#f0f0f8', margin:'0 0 6px' }}>Verification</h2>
            <p style={{ color:'rgba(255,255,255,0.35)', fontSize:13, margin:0 }}>Identity confirmed — click below to enter</p>
          </div>
          <div style={{ padding:'16px', background:'rgba(34,211,238,0.07)', border:'1px solid rgba(34,211,238,0.2)', borderRadius:12, marginBottom:20, textAlign:'center' }}>
            <div style={{ fontSize:13, color:'rgba(255,255,255,0.6)' }}>Logged in as</div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:18, fontWeight:700, color:'#22d3ee', marginTop:4 }}>@{ADMIN_USER}</div>
          </div>
          <ABtn onClick={()=>{ try { sessionStorage.setItem('pv_admin_token', tokenRef.current); localStorage.removeItem('pv_is_admin'); } catch(e){} onLogin(); }} variant="primary" style={{ width:'100%' }}>Enter Admin Panel →</ABtn>
            {cloud && <div style={{ marginTop:12, fontSize:12.5, lineHeight:1.5, color: cloud.startsWith('☁') ? '#4ade80' : '#fbbf24' }}>{cloud}</div>}
        </>}
      </div>
    </div>
  );
}

// ---- CHANNELS TAB ----
function ChannelsTab({ supabase, localChannels, setLocalChannels }) {
  const [editing, setEditing] = React.useState(null);
  const [form, setForm] = React.useState({});
  const [saving, setSaving] = React.useState(false);
  const [msg, setMsg] = React.useState('');

  const startEdit = (ch) => { let lg=''; try { lg=(JSON.parse(localStorage.getItem('pv_logos')||'{}'))[ch.sno]||''; } catch {} setEditing(ch.sno); setForm({...ch, logo: lg, playlists: ch.playlists.join('\n')}); };
  const startNew  = () => { setEditing('NEW'); setForm({ sno:'', name:'', handle:'', cat:'Education', url:'', score:'', cpm:'Medium', team:1, status:'LIVE', logo:'', playlists:'' }); };
  const cancel    = () => { setEditing(null); setForm({}); };

  // ---- planet logo upload (downscaled, saved to localStorage 'pv_logos') ----
  const saveLogo = (sno, dataUrl) => {
    if (!sno) return true;
    let map = {}; try { map = JSON.parse(localStorage.getItem('pv_logos')||'{}'); } catch {}
    if (dataUrl) map[sno] = dataUrl; else delete map[sno];
    try {
      localStorage.setItem('pv_logos', JSON.stringify(map));
      window.dispatchEvent(new Event('pv-logos'));
      return true;
    } catch (err) {
      // Most likely the ~5MB localStorage quota was exceeded by large images.
      alert('Could not save this logo — browser storage is full.\\nTry a smaller image, or remove a few existing logos first.');
      return false;
    }
  };
  const onLogoFile = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const S = 160, c = document.createElement('canvas'); c.width = S; c.height = S;
        const ctx = c.getContext('2d');
        const scale = Math.max(S/img.width, S/img.height);
        const dw = img.width*scale, dh = img.height*scale;
        ctx.drawImage(img, (S-dw)/2, (S-dh)/2, dw, dh);
        const url = c.toDataURL('image/png');
        setForm(f => ({ ...f, logo: url }));
        if (form.sno) saveLogo(form.sno, url);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };
  const removeLogo = () => { setForm(f => ({ ...f, logo: '' })); if (form.sno) saveLogo(form.sno, ''); };

  const save = async () => {
    setSaving(true);
    const ch = { ...form, score: parseInt(form.score)||0, team: parseInt(form.team)||1, playlists: form.playlists.split('\n').map(s=>s.trim()).filter(Boolean) };
    if (editing === 'NEW') {
      const updated = [...localChannels, ch];
      setLocalChannels(updated);
      if (supabase) {
        await supabase.from('channels').insert([{ sno:ch.sno, channel_name:ch.name, handle:ch.handle, category:ch.cat, youtube_url:ch.url, viral_score:ch.score, cpm_tier:ch.cpm, team_size:ch.team, status:ch.status }]);
      }
    } else {
      const updated = localChannels.map(c => c.sno===editing ? ch : c);
      setLocalChannels(updated);
      if (supabase) {
        await supabase.from('channels').update({ channel_name:ch.name, handle:ch.handle, category:ch.cat, youtube_url:ch.url, viral_score:ch.score, cpm_tier:ch.cpm, team_size:ch.team, status:ch.status }).eq('sno', editing);
      }
    }
    setMsg('Saved ✓'); setSaving(false); setEditing(null);
    setTimeout(()=>setMsg(''), 2000);
  };

  const del = (sno) => {
    if (!confirm('Delete this channel?')) return;
    setLocalChannels(localChannels.filter(c=>c.sno!==sno));
    if (supabase) supabase.from('channels').delete().eq('sno', sno);
  };

  const cats = Array.from(new Set(CHANNELS.map(c=>c.cat)));

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <div>
          <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:20, fontWeight:800, color:'#f0f0f8', margin:0 }}>Channels</h3>
          <span style={{ fontSize:13, color:'rgba(255,255,255,0.4)' }}>{localChannels.length} total</span>
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center' }}>
          {msg && <span style={{ fontSize:13, color:'#4ade80' }}>{msg}</span>}
          <ABtn onClick={startNew} variant="primary">+ Add Channel</ABtn>
        </div>
      </div>

      {editing && (
        <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:16, padding:24, marginBottom:20 }}>
          <h4 style={{ color:'#c084fc', margin:'0 0 18px', fontFamily:"'Space Grotesk',sans-serif" }}>{editing==='NEW' ? '+ New Channel' : 'Edit Channel'}</h4>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginBottom:14 }}>
            <AInput label="S.No" value={form.sno||''} onChange={v=>setForm({...form,sno:v})} placeholder="1.38" />
            <AInput label="Channel Name" value={form.name||''} onChange={v=>setForm({...form,name:v})} placeholder="Pujiverse Example" />
            <AInput label="Handle" value={form.handle||''} onChange={v=>setForm({...form,handle:v})} placeholder="@pujiverseexample" />
            <AInput label="YouTube URL" value={form.url||''} onChange={v=>setForm({...form,url:v})} placeholder="https://youtube.com/@..." />
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              <label style={{ fontSize:12, fontWeight:600, color:'rgba(255,255,255,0.45)', textTransform:'uppercase', letterSpacing:1 }}>Category</label>
              <select value={form.cat||''} onChange={e=>setForm({...form,cat:e.target.value})} style={{ padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none' }}>
                {cats.map(c=><option key={c} value={c} style={{background:'#0e0e1a'}}>{c}</option>)}
              </select>
            </div>
            <AInput label="Viral Score" value={form.score||''} onChange={v=>setForm({...form,score:v})} placeholder="85" type="number" />
            <AInput label="Team Size" value={form.team||''} onChange={v=>setForm({...form,team:v})} placeholder="1" type="number" />
            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              <label style={{ fontSize:12, fontWeight:600, color:'rgba(255,255,255,0.45)', textTransform:'uppercase', letterSpacing:1 }}>Status</label>
              <select value={form.status||'LIVE'} onChange={e=>setForm({...form,status:e.target.value})} style={{ padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none' }}>
                {['LIVE','PENDING','PAUSED'].map(s=><option key={s} value={s} style={{background:'#0e0e1a'}}>{s}</option>)}
              </select>
            </div>
          </div>
          <ATextarea label="Playlists (one per line)" value={form.playlists||''} onChange={v=>setForm({...form,playlists:v})} rows={6} placeholder="Playlist 1 name&#10;Playlist 2 name&#10;..." />
          {/* Planet logo uploader */}
          <div style={{ display:'flex', alignItems:'center', gap:14, marginTop:16, padding:'14px 16px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:12 }}>
            <div style={{ width:60, height:60, borderRadius:'50%', overflow:'hidden', flexShrink:0, border:'1px solid rgba(255,255,255,0.18)', background:'rgba(255,255,255,0.05)', display:'flex', alignItems:'center', justifyContent:'center' }}>
              {form.logo ? <img src={form.logo} alt="" style={{ width:'100%', height:'100%', objectFit:'cover' }}/> : <span style={{ fontSize:26 }}>{(typeof chIcon==='function' && form.sno) ? chIcon(form) : '🪐'}</span>}
            </div>
            <div style={{ flex:1 }}>
              <div style={{ fontSize:13, fontWeight:700, color:'#e8e8f8', marginBottom:6 }}>Planet Logo {form.sno ? '' : <span style={{ color:'#fb923c', fontWeight:500 }}>(enter S.No first to save)</span>}</div>
              <div style={{ display:'flex', gap:8 }}>
                <label style={{ cursor:'pointer', padding:'8px 14px', borderRadius:10, fontSize:13, fontWeight:600, background:'linear-gradient(135deg,#22d3ee,#c084fc)', color:'#0a0a15' }}>
                  {form.logo ? 'Replace image' : 'Upload image'}
                  <input type="file" accept="image/*" onChange={onLogoFile} style={{ display:'none' }} />
                </label>
                {form.logo && <ABtn onClick={removeLogo} variant="danger" size="sm">Remove</ABtn>}
              </div>
              <div style={{ fontSize:11, color:'rgba(255,255,255,0.4)', marginTop:6 }}>Square PNG/JPG works best — auto-resized and shown as the planet face in the solar system.</div>
            </div>
          </div>
          <div style={{ display:'flex', gap:10, marginTop:14 }}>
            <ABtn onClick={save} variant="primary">{saving ? 'Saving...' : 'Save Channel'}</ABtn>
            <ABtn onClick={cancel} variant="ghost">Cancel</ABtn>
          </div>
        </div>
      )}

      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {localChannels.map(ch => {
          const col = CAT_COLORS[ch.cat] || CAT_COLORS["Education"];
          return (
            <div key={ch.sno} style={{ display:'flex', alignItems:'center', gap:14, padding:'14px 16px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:12 }}>
              <div style={{ width:36, height:36, borderRadius:10, background:`${col.badge}33`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:col.accent, flexShrink:0 }}>{ch.sno}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:14, fontWeight:700, color:'#e8e8f8', marginBottom:2 }}>{ch.name}</div>
                <div style={{ fontSize:12, color:'rgba(255,255,255,0.35)' }}>{ch.handle} · {ch.cat} · {ch.playlists.length} playlists</div>

                {ch.url && <a href={safeUrl(ch.url)} target="_blank" rel="noreferrer" style={{ padding:'5px 10px', background:'rgba(255,0,0,0.12)', border:'1px solid rgba(255,0,0,0.2)', borderRadius:8, fontSize:11, color:'#ff6b6b', textDecoration:'none' }}>YT</a>}
                <ABtn onClick={()=>startEdit(ch)} variant="ghost" size="sm">Edit</ABtn>
                <ABtn onClick={()=>del(ch.sno)} variant="danger" size="sm">Del</ABtn>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---- VIDEOS TAB ----
function VideosTab({ supabase, localChannels, localVideos, setLocalVideos }) {
  const [selCh, setSelCh] = React.useState('');
  const [selPl, setSelPl] = React.useState('');
  const [form, setForm] = React.useState({ title:'', url:'' });
  const [msg, setMsg] = React.useState('');

  const ch = localChannels.find(c=>c.sno===selCh);
  const playlists = ch ? ch.playlists : [];
  const vids = (selCh && selPl !== '') ? (localVideos[selCh]?.[selPl] || []) : [];

  const addVideo = async () => {
    if (!form.title || !form.url || !selCh || selPl==='') { setMsg('Fill all fields'); return; }
    const updated = JSON.parse(JSON.stringify(localVideos));
    if (!updated[selCh]) updated[selCh] = {};
    if (!updated[selCh][selPl]) updated[selCh][selPl] = [];
    updated[selCh][selPl].push({ title: form.title, url: form.url });
    setLocalVideos(updated);
    localStorage.setItem('pv_videos', JSON.stringify(updated));
    if (supabase) {
      const plName = playlists[parseInt(selPl)];
      await supabase.from('videos').insert([{ channel_sno:selCh, playlist_index:parseInt(selPl), playlist_name:plName, title:form.title, video_url:form.url }]);
    }
    setForm({ title:'', url:'' });
    setMsg('Video added ✓'); setTimeout(()=>setMsg(''), 2000);
  };

  const delVideo = (idx) => {
    const updated = JSON.parse(JSON.stringify(localVideos));
    updated[selCh][selPl].splice(idx, 1);
    setLocalVideos(updated);
    localStorage.setItem('pv_videos', JSON.stringify(updated));
  };

  return (
    <div>
      <div style={{ marginBottom:20 }}>
        <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:20, fontWeight:800, color:'#f0f0f8', margin:'0 0 4px' }}>Video Manager</h3>
        <p style={{ color:'rgba(255,255,255,0.4)', fontSize:13, margin:0 }}>Add videos to any playlist — they'll appear in the public view</p>
      </div>

      {/* Step 1: Pick channel */}
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:20 }}>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          <label style={{ fontSize:12, fontWeight:600, color:'rgba(255,255,255,0.45)', textTransform:'uppercase', letterSpacing:1 }}>Channel</label>
          <select value={selCh} onChange={e=>{setSelCh(e.target.value);setSelPl('');}} style={{ padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none' }}>
            <option value="" style={{background:'#0e0e1a'}}>— Select Channel —</option>
            {localChannels.map(c=><option key={c.sno} value={c.sno} style={{background:'#0e0e1a'}}>{c.name}</option>)}
          </select>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
          <label style={{ fontSize:12, fontWeight:600, color:'rgba(255,255,255,0.45)', textTransform:'uppercase', letterSpacing:1 }}>Playlist</label>
          <select value={selPl} onChange={e=>setSelPl(e.target.value)} disabled={!selCh} style={{ padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none', opacity: selCh?1:0.4 }}>
            <option value="" style={{background:'#0e0e1a'}}>— Select Playlist —</option>
            {playlists.map((pl,i)=><option key={i} value={i} style={{background:'#0e0e1a'}}>{pl}</option>)}
          </select>
        </div>
      </div>

      {/* Add video form */}
      {selCh && selPl !== '' && (
        <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:16, padding:20, marginBottom:20 }}>
          <h4 style={{ color:'#c084fc', margin:'0 0 14px', fontSize:14, fontFamily:"'Space Grotesk',sans-serif" }}>Add New Video</h4>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
            <AInput label="Video Title" value={form.title} onChange={v=>setForm({...form,title:v})} placeholder="My Awesome Video" />
            <AInput label="YouTube URL" value={form.url} onChange={v=>setForm({...form,url:v})} placeholder="https://youtube.com/watch?v=..." />
          </div>
          <div style={{ display:'flex', gap:10, alignItems:'center' }}>
            <ABtn onClick={addVideo} variant="primary">+ Add Video</ABtn>
            {msg && <span style={{ fontSize:13, color: msg.includes('✓')?'#4ade80':'#f87171' }}>{msg}</span>}
          </div>
        </div>
      )}

      {/* Video list */}
      {selCh && selPl !== '' && (
        <div>
          <div style={{ fontSize:13, color:'rgba(255,255,255,0.4)', marginBottom:10 }}>{vids.length} video{vids.length!==1?'s':''} in this playlist</div>
          {vids.length === 0 && <div style={{ padding:'20px', textAlign:'center', color:'rgba(255,255,255,0.2)', fontSize:14 }}>No videos yet — add one above</div>}
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            {vids.map((v,i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 14px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:10 }}>
                <div style={{ width:22, height:22, borderRadius:6, background:'rgba(255,0,0,0.2)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                  <SocialIcon icon="yt" size={10}/>
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:'#e0e0f0', marginBottom:2 }}>{v.title}</div>
                  <a href={safeUrl(v.url)} target="_blank" rel="noreferrer" style={{ fontSize:11, color:'rgba(255,255,255,0.35)', textDecoration:'none' }}>{v.url}</a>
                </div>
                <ABtn onClick={()=>delVideo(i)} variant="danger" size="sm">×</ABtn>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12, gap: 10, flexWrap: 'wrap' }}>
                <b style={{ color: p.color }}>{p.emo} {names[k]}</b>
                <label style={{ fontSize: 12, display: 'flex', gap: 6, alignItems: 'center', cursor: 'pointer' }}><input type="checkbox" checked={p.show !== false} onChange={e => setP(k, 'show', e.target.checked)} /> Show on home page</label>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(150px,1fr))', gap: 10 }}>
                <div><label style={lab}>Label</label><input style={inp} value={p.label || ''} onChange={e => setP(k, 'label', e.target.value)} /></div>
                <div><label style={lab}>Subtitle {hasHref ? '' : '(blank = auto count)'}</label><input style={inp} value={p.sub || ''} onChange={e => setP(k, 'sub', e.target.value)} /></div>
                <div><label style={lab}>Emoji</label><input style={inp} value={p.emo || ''} onChange={e => setP(k, 'emo', e.target.value)} /></div>
