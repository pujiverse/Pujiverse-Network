// ---- GOOGLE SHEETS SYNC TAB ----
const PV_APPS_SCRIPT_CODE = `function doGet() {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var out = {};
  ss.getSheets().forEach(function(sh) {
    var rows = sh.getDataRange().getValues();
    if (rows.length < 2) { out[sh.getName()] = []; return; }
    var head = rows[0];
    out[sh.getName()] = rows.slice(1).map(function(r) {
      var o = {}; head.forEach(function(h, i) { o[h] = r[i]; }); return o;
    });
  });
  return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);
}
function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var updated = [];
  Object.keys(data).forEach(function(name) {
    var rows = data[name];
    if (!Array.isArray(rows)) return;
    var sh = ss.getSheetByName(name) || ss.insertSheet(name);
    sh.clearContents();
    updated.push(name);
    if (!rows.length) return;
    var head = Object.keys(rows[0]);
    sh.getRange(1, 1, 1, head.length).setValues([head]);
    var vals = rows.map(function(r) {
      return head.map(function(h) {
        var v = r[h];
        if (v === null || v === undefined) return '';
        if (typeof v === 'object') return JSON.stringify(v);
        return v;
      });
    });
    sh.getRange(2, 1, vals.length, head.length).setValues(vals);
  });
  return ContentService.createTextOutput(JSON.stringify({ ok: true, updated: updated })).setMimeType(ContentService.MimeType.JSON);
}`;

function SheetsTab({ supabase, localChannels, setLocalChannels, localVideos, setLocalVideos, localSocial, setLocalSocial, localWebsites, setLocalWebsites, localPosts, setLocalPosts }) {
  const [gsUrl, setGsUrl] = React.useState(() => localStorage.getItem('pv_gs_url') || '');
  const [auto, setAuto] = React.useState(() => localStorage.getItem('pv_gs_auto') === '1');
  const [mins, setMins] = React.useState(() => parseInt(localStorage.getItem('pv_gs_mins'), 10) || 10);
  const [busy, setBusy] = React.useState(false);
  const [showCode, setShowCode] = React.useState(false);
  const [lines, setLines] = React.useState([]);
  const log = (line, ok = true) => setLines(prev => [...prev.slice(-80), { line, ok, t: new Date().toLocaleTimeString() }]);
  const saveCfg = () => { localStorage.setItem('pv_gs_url', gsUrl.trim()); log('✓ Google Sheet connection saved'); };

  const collect = () => {
    const vidRows = [];
    Object.entries(localVideos || {}).forEach(([sno, plMap]) => Object.entries(plMap || {}).forEach(([pi, vids]) => (vids || []).forEach((v, i) => vidRows.push({ channel_sno: sno, playlist_index: pi, title: v.title || '', url: v.url || '', sort_order: i }))));
    const subRows = [];
    (localChannels || []).forEach(ch => { try { JSON.parse(localStorage.getItem('pv_lot_subs_' + ch.sno) || '[]').forEach(s => subRows.push({ channel_sno: ch.sno, ...s })); } catch (e) {} });
    let hist = []; try { hist = JSON.parse(localStorage.getItem('pv_lot_history') || '[]'); } catch (e) {}
    return { channels: localChannels, videos: vidRows, social_links: localSocial, websites: localWebsites, posts: localPosts, lottery_subscribers: subRows, lottery_history: hist };
  };

  const pushSheet = async () => {
    if (!gsUrl.trim()) { log('✗ Paste your Apps Script Web App URL first (setup steps above)', false); return false; }
    try {
      const res = await fetch(gsUrl.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(collect()) });
      const j = await res.json();
      log(`✓ Pushed to Google Sheet — ${(j.updated || []).length} tabs updated (${(j.updated || []).join(', ')})`);
      return true;
    } catch (e) { log('✗ Sheet push failed: ' + (e.message || e) + ' — check the URL and that deployment access is "Anyone"', false); return false; }
  };

  const pullSheet = async () => {
    if (!gsUrl.trim()) { log('✗ Paste your Apps Script Web App URL first', false); return; }
    if (!confirm('Pull will REPLACE the data in this browser with the Google Sheet contents. Continue?')) return;
    try {
      const res = await fetch(gsUrl.trim());
      const j = await res.json();
      const parse = (v, fb) => { if (Array.isArray(v)) return v; try { const p = JSON.parse(v); return Array.isArray(p) ? p : fb; } catch (e) { return fb; } };
      if (Array.isArray(j.channels) && j.channels.length) { setLocalChannels(j.channels.map(c => ({ ...c, playlists: parse(c.playlists, []) }))); log(`✓ channels: ${j.channels.length} pulled`); }
      if (Array.isArray(j.social_links) && j.social_links.length) { setLocalSocial(j.social_links); log(`✓ social_links: ${j.social_links.length} pulled`); }
      if (Array.isArray(j.websites)) { setLocalWebsites(j.websites.map(w => ({ ...w, tags: parse(w.tags, []) }))); log(`✓ websites: ${j.websites.length} pulled`); }
      if (Array.isArray(j.posts)) { setLocalPosts(j.posts); log(`✓ posts: ${j.posts.length} pulled`); }
      if (Array.isArray(j.videos)) {
        const nested = {};
        j.videos.forEach(v => { if (!v.channel_sno) return; const pi = String(v.playlist_index ?? 0); (nested[v.channel_sno] = nested[v.channel_sno] || {}); (nested[v.channel_sno][pi] = nested[v.channel_sno][pi] || []).push({ title: v.title, url: v.url }); });
        setLocalVideos(nested); localStorage.setItem('pv_videos', JSON.stringify(nested)); log(`✓ videos: ${j.videos.length} pulled`);
      }
      if (Array.isArray(j.lottery_subscribers)) {
        const bySno = {};
        j.lottery_subscribers.forEach(s => { if (!s.channel_sno) return; const { channel_sno, ...rest } = s; (bySno[channel_sno] = bySno[channel_sno] || []).push(rest); });
        Object.entries(bySno).forEach(([sno, subs]) => { try { localStorage.setItem('pv_lot_subs_' + sno, JSON.stringify(subs)); } catch (e) {} });
        log(`✓ lottery_subscribers: ${j.lottery_subscribers.length} pulled`);
      }
      if (Array.isArray(j.lottery_history)) {
        try { localStorage.setItem('pv_lot_history', JSON.stringify(j.lottery_history.map(h => ({ ...h, winners: parse(h.winners, []) })))); } catch (e) {}
        log(`✓ lottery_history: ${j.lottery_history.length} pulled`);
      }
      if (window.pvReloadData) window.pvReloadData();
      log('— Pull done —');
    } catch (e) { log('✗ Sheet pull failed: ' + (e.message || e), false); }
  };

  const pushSupabase = async () => {
    if (!supabase) { log('✗ Supabase not connected — connect it in the ⚙ Supabase tab first', false); return; }
    await pvSupabasePush(supabase, { localChannels, localVideos, localSocial, localWebsites, localPosts }, log);
  };
  const pushEverywhere = async () => { setBusy(true); await pushSheet(); await pushSupabase(); setBusy(false); };

  // Auto-sync: pushes app data to Sheet + Supabase every N minutes (while the site is open)
  React.useEffect(() => {
    localStorage.setItem('pv_gs_auto', auto ? '1' : '0');
    localStorage.setItem('pv_gs_mins', String(mins));
    if (!auto || !gsUrl.trim()) return;
    const id = setInterval(() => { pushEverywhere(); }, Math.max(2, mins) * 60000);
    return () => clearInterval(id);
  }, [auto, mins, gsUrl, supabase, localChannels, localVideos, localSocial, localWebsites, localPosts]);

  const gsBtn = { padding: '9px 16px', borderRadius: 10, border: '1px solid rgba(255,255,255,0.15)', background: 'rgba(255,255,255,0.06)', color: '#e8e8f8', cursor: 'pointer', fontSize: 13, fontWeight: 600 };
  return (
    <div>
      <h3 style={{ fontFamily: "'Space Grotesk',sans-serif", fontSize: 20, fontWeight: 800, color: '#f0f0f8', margin: '0 0 6px' }}>Google Sheets Sync</h3>
      <p style={{ color: 'rgba(255,255,255,0.4)', fontSize: 13, margin: '0 0 24px' }}>Two-way sync between this app, your Google Sheet and Supabase</p>
      <div style={{ background: 'rgba(34,211,238,0.06)', border: '1px solid rgba(34,211,238,0.2)', borderRadius: 14, padding: 20, marginBottom: 20 }}>
        <div style={{ fontSize: 13, fontWeight: 600, color: '#22d3ee', marginBottom: 12 }}>One-time setup (≈2 minutes):</div>
        <ol style={{ margin: 0, padding: '0 0 0 20px', color: 'rgba(255,255,255,0.55)', fontSize: 13, lineHeight: 2 }}>
          <li>Create a Google Sheet at <a href="https://sheets.new" target="_blank" rel="noreferrer" style={{ color: '#22d3ee' }}>sheets.new</a> (name it e.g. “Pujiverse Data”)</li>
          <li>In the sheet: <strong style={{ color: '#e8e8f8' }}>Extensions → Apps Script</strong>, delete the sample code, paste the code below, save</li>
          <li>Click <strong style={{ color: '#e8e8f8' }}>Deploy → New deployment → Web app</strong> — Execute as: <strong style={{ color: '#e8e8f8' }}>Me</strong> · Access: <strong style={{ color: '#e8e8f8' }}>Anyone</strong> → Deploy</li>
          <li>Copy the <strong style={{ color: '#e8e8f8' }}>Web app URL</strong> (ends in /exec) and paste it below</li>
        </ol>
        <div style={{ display: 'flex', gap: 10, marginTop: 14, flexWrap: 'wrap' }}>
          <button style={gsBtn} onClick={() => { navigator.clipboard.writeText(PV_APPS_SCRIPT_CODE).then(() => log('✓ Apps Script code copied — paste it in Extensions → Apps Script')); }}>📋 Copy Apps Script code</button>
          <button style={gsBtn} onClick={() => setShowCode(s => !s)}>{showCode ? 'Hide code' : 'Show code'}</button>
        </div>
        {showCode && <pre style={{ background: 'rgba(0,0,0,0.4)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 10, padding: 16, fontSize: 11.5, color: '#a8d8a8', overflow: 'auto', maxHeight: 260, lineHeight: 1.6, marginTop: 12 }}>{PV_APPS_SCRIPT_CODE}</pre>}
      </div>
      <div style={{ display: 'flex', gap: 10, alignItems: 'flex-end', flexWrap: 'wrap', marginBottom: 20 }}>
        <div style={{ flex: 1, minWidth: 280 }}><AInput label="Apps Script Web App URL" value={gsUrl} onChange={setGsUrl} placeholder="https://script.google.com/macros/s/…/exec" /></div>
        <ABtn onClick={saveCfg} variant="primary">Save</ABtn>
      </div>
      <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 20 }}>
        <button style={{ ...gsBtn, background: 'linear-gradient(135deg,#4ade80,#22d3ee)', color: '#04040c', border: 'none' }} disabled={busy} onClick={pushEverywhere}>{busy ? 'Syncing…' : '🚀 Push Everywhere (Sheet + Supabase)'}</button>
        <button style={gsBtn} onClick={pushSheet}>⬆ Push to Sheet</button>
        <button style={gsBtn} onClick={pullSheet}>⬇ Pull from Sheet</button>
        <button style={gsBtn} onClick={pushSupabase}>⬆ Push to Supabase</button>
      </div>
      <div style={{ background: 'rgba(192,132,252,0.06)', border: '1px solid rgba(192,132,252,0.25)', borderRadius: 14, padding: '16px 20px', marginBottom: 20, display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', fontSize: 14, fontWeight: 700, color: auto ? '#c084fc' : 'rgba(255,255,255,0.6)' }}>
          <input type="checkbox" checked={auto} onChange={e => setAuto(e.target.checked)} style={{ width: 18, height: 18, accentColor: '#c084fc' }} />
          Auto-sync
        </label>
        <select value={mins} onChange={e => setMins(parseInt(e.target.value, 10))} style={{ padding: '7px 10px', background: 'rgba(255,255,255,0.06)', border: '1px solid rgba(255,255,255,0.12)', borderRadius: 8, color: '#e8e8f8', fontSize: 13 }}>
          {[5, 10, 15, 30, 60].map(m => <option key={m} value={m}>every {m} min</option>)}
        </select>
        <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.45)' }}>Pushes app data to your Sheet {supabase ? '+ Supabase ' : ''}automatically while the admin panel is open.</span>
      </div>
      {lines.length > 0 && (
        <div style={{ background: 'rgba(0,0,0,0.4)', border: '1px solid rgba(255,255,255,0.06)', borderRadius: 10, padding: '10px 14px', fontFamily: 'ui-monospace,Menlo,Consolas,monospace', fontSize: 12, lineHeight: 1.7, maxHeight: 240, overflow: 'auto' }}>
          {lines.map((l, i) => <div key={i} style={{ color: l.ok ? 'rgba(255,255,255,0.7)' : '#fca5a5' }}><span style={{ color: 'rgba(255,255,255,0.3)', marginRight: 8 }}>{l.t}</span>{l.line}</div>)}
        </div>
      )}
    </div>
  );
}

// ---- SUPABASE CONFIG TAB ----
// Shared: push ALL local data to Supabase (used by ⚙ Supabase tab + 📊 Sheets auto-sync)
async function pvSupabasePush(supabase, { localChannels, localVideos, localSocial, localWebsites, localPosts }, log) {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { log('✗ Not signed in to Supabase — use ☁ Cloud login in the top bar first. Writes are blocked without it.', false); return; }
      log('☁ Signed in as ' + session.user.email);
    } catch (e) { log('✗ Could not read the Supabase session: ' + (e.message || e), false); return; }

    // 1. CHANNELS — upsert by sno
    try {
      const rows = localChannels.map(ch => ({
        sno: ch.sno, channel_name: ch.name, name: ch.name, group_name: ch.group || null, score: parseInt(ch.score)||0, handle: ch.handle, category: ch.cat,
        youtube_url: ch.url, viral_score: parseInt(ch.score)||0, cpm_tier: ch.cpm,
        team_size: parseInt(ch.team)||1, status: ch.status
      }));
      const { error } = await supabase.from('channels').upsert(rows, { onConflict: 'sno' });
      if (error) throw error;
      log(`✓ channels: ${rows.length} rows synced`);
    } catch(e) { log(`✗ channels: ${e.message || e}`, false); }

    // 1b. PLAYLISTS — replaced per channel
    try {
      const rows = [];
      localChannels.forEach(ch => (ch.playlists || []).forEach((p, i) => {
        const name = typeof p === 'string' ? p : (p && (p.name || p.playlist_name)) || '';
        if (name) rows.push({ channel_sno: ch.sno, playlist_name: name, sort_order: i });
      }));
      const del = await supabase.from('playlists').delete().in('channel_sno', localChannels.map(c => c.sno));
      if (del.error) throw del.error;
      for (let i = 0; i < rows.length; i += 500) { const { error } = await supabase.from('playlists').insert(rows.slice(i, i + 500)); if (error) throw error; }
      log(`✓ playlists: ${rows.length} rows synced`);
    } catch(e) { log(`✗ playlists: ${e.message || e}`, false); }

    // 2. SOCIAL LINKS — clear + reinsert (simplest)
    try {
      const rows = localSocial.map((s,i) => ({
        platform: s.platform, handle: s.handle, url: s.url,
        icon_key: s.icon, brand_color: s.color, group_name: s.group || null, display_order: i, is_active: true
      }));
      const delS = await supabase.from('social_links').delete().neq('platform','__none__');
      if (delS.error) throw delS.error;
      const { error } = await supabase.from('social_links').insert(rows);
      if (error) throw error;
      log(`✓ social_links: ${rows.length} rows synced`);
    } catch(e) { log(`✗ social_links: ${e.message || e}`, false); }

    // 3. VIDEOS
    try {
      const rows = [];
      Object.entries(localVideos).forEach(([sno, plMap]) => {
        Object.entries(plMap || {}).forEach(([plIdx, vids]) => {
          (vids || []).forEach((v, i) => rows.push({
            channel_sno: sno, playlist_index: parseInt(plIdx),
            playlist_name: localChannels.find(c=>c.sno===sno)?.playlists?.[parseInt(plIdx)] || '',
            title: v.title, video_url: v.url, sort_order: i
          }));
        });
      });
      if (rows.length > 0) {
        await supabase.from('videos').delete().neq('id','00000000-0000-0000-0000-000000000000');
        const { error } = await supabase.from('videos').insert(rows);
        if (error) throw error;
      }
      log(`✓ videos: ${rows.length} rows synced`);
    } catch(e) { log(`✗ videos: ${e.message || e}`, false); }

    // 4. WEBSITES
    try {
      const rows = (localWebsites || []).map((w, i) => ({
        id: w.id, title: w.title, url: w.url, description: w.description || '',
        category: w.cat || (w.tags || [])[0] || null, tech: w.tech || null, host: w.host || null, repo: w.repo || null,
        is_live: true, display_order: i, tags: w.tags || [], accent: w.accent || '#22d3ee'
      }));
      const { error } = await supabase.from('websites').upsert(rows, { onConflict: 'id' });
      if (error) throw error;
      log(`✓ websites: ${rows.length} rows synced`);
    } catch(e) { log(`✗ websites: ${e.message || e} — make sure you ran the new SQL below`, false); }

    // 5. POSTS
    try {
      const rows = (localPosts || []).map(p => ({
        id: p.id, title: p.title, url: p.url, platform: p.platform,
        cover: p.cover || '', summary: p.summary || '',
        post_date: p.date && /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : null
      }));
      const { error } = await supabase.from('posts').upsert(rows, { onConflict: 'id' });
      if (error) throw error;
      log(`✓ posts: ${rows.length} rows synced`);
    } catch(e) { log(`✗ posts: ${e.message || e} — make sure you ran the new SQL below`, false); }

    // 6. LOTTERY SUBSCRIBERS — across all channels
    try {
      const rows = [];
      localChannels.forEach(ch => {
        try {
          const subs = JSON.parse(localStorage.getItem('pv_lot_subs_' + ch.sno) || '[]');
          subs.forEach(s => rows.push({
            sub_id: s.id, channel_sno: ch.sno,
            name: s.name || '', handle: s.handle || '', email: s.email || '',
            subscriber_id: s.subscriberId || '', phone: s.phone || ''
          }));
        } catch(e) {}
      });
      if (rows.length > 0) {
        await supabase.from('lottery_subscribers').delete().neq('sub_id','__none__');
        const { error } = await supabase.from('lottery_subscribers').insert(rows);
        if (error) throw error;
      }
      log(`✓ lottery_subscribers: ${rows.length} rows synced`);
    } catch(e) { log(`✗ lottery_subscribers: ${e.message || e} — make sure you ran the new SQL below`, false); }

    // 7. LOTTERY HISTORY
    try {
      const hist = JSON.parse(localStorage.getItem('pv_lot_history') || '[]');
      const rows = hist.map(h => ({
        history_id: h.id, channel_name: h.channel, channel_sno: h.channelSno,
        draw_date: h.date, pool_size: h.poolSize, winner_count: h.winnerCount,
        winners: h.winners
      }));
      if (rows.length > 0) {
        const { error } = await supabase.from('lottery_history').upsert(rows, { onConflict: 'history_id' });
        if (error) throw error;
      }
      log(`✓ lottery_history: ${rows.length} rows synced`);
    } catch(e) { log(`✗ lottery_history: ${e.message || e} — make sure you ran the new SQL below`, false); }

    log('— Done —');
}

DO $$
DECLARE t text;
BEGIN
  FOREACH t IN ARRAY ARRAY['playlists','social_links','websites','posts','announcements','subscribers','lottery_entries','lottery_subscribers','lottery_history','site_settings']
  LOOP

  END LOOP;

-- 15. ROW LEVEL SECURITY ---------------------------------------
-- Remove every old policy on these tables first (old wide-open ones included)
DO $$
DECLARE r record;
BEGIN
  FOR r IN SELECT policyname, tablename FROM pg_policies WHERE schemaname = 'public'

DO $$
DECLARE t text;
BEGIN
  FOREACH t IN ARRAY ARRAY['channels','playlists','videos','social_links','websites','posts','announcements','subscribers','lottery_entries','lottery_subscribers','lottery_history','site_settings','messages','bq_sync_runs','admin_users']

  FOREACH t IN ARRAY ARRAY['channels','playlists','videos','social_links','websites','posts','announcements','site_settings']

function LotterySubsTab({ localChannels }) {
  const [selSno, setSelSno]   = React.useState(localChannels[0]?.sno || '');
  const [subs, setSubs]       = React.useState([]);
  const [paste, setPaste]     = React.useState('');
  const [manForm, setManForm] = React.useState({ name:'', handle:'', email:'', subscriberId:'', phone:'' });
  const [msg, setMsg]         = React.useState('');
  const [search, setSearch]   = React.useState('');

  const showMsg = (m, ok=true) => { setMsg({text:m,ok}); setTimeout(()=>setMsg(''),2500); };
  const uid = () => Math.random().toString(36).slice(2)+Date.now().toString(36);

  // Load subs whenever selected channel changes
  React.useEffect(() => {
    if (!selSno) return;
    try { setSubs(JSON.parse(localStorage.getItem('pv_lot_subs_'+selSno) || '[]')); }
    catch { setSubs([]); }
  }, [selSno]);

  const persist = (arr) => {
    setSubs(arr);
    localStorage.setItem('pv_lot_subs_'+selSno, JSON.stringify(arr));
  };

  const addManual = () => {
    if (!manForm.name.trim()) { showMsg('Name is required', false); return; }
    persist([...subs, { id:uid(), ...manForm }]);
    setManForm({ name:'', handle:'', email:'', subscriberId:'', phone:'' });
    showMsg('Subscriber added ✓');
  };

  const addPaste = () => {
    const lines = paste.split('\n').map(l=>l.trim()).filter(Boolean);
    const newSubs = lines.map(l => {
      const parts = l.split(',').map(s=>s.trim());
      return { id:uid(), name:parts[0]||l, handle:parts[1]||'', email:parts[2]||'', subscriberId:parts[3]||'', phone:parts[4]||'' };
    });
    if (newSubs.length === 0) { showMsg('Nothing to add', false); return; }
    persist([...subs, ...newSubs]);
    setPaste('');
    showMsg(`Added ${newSubs.length} subscribers ✓`);
  };

  const delSub = (id) => persist(subs.filter(s => s.id !== id));
  const clearAll = () => {
    if (!confirm(`Delete ALL ${subs.length} subscribers?`)) return;
    persist([]);
  };

  const filtered = subs.filter(s => {
    const q = search.toLowerCase();
    if (!q) return true;
    return (s.name||'').toLowerCase().includes(q)
      || (s.handle||'').toLowerCase().includes(q)
      || (s.email||'').toLowerCase().includes(q);
  });

  const ch = localChannels.find(c=>c.sno===selSno);
  const accent = ch ? (CAT_COLORS[ch.cat]?.accent || '#c084fc') : '#c084fc';

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
        <div>
          <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:20, fontWeight:800, color:'#f0f0f8', margin:0 }}>Lottery Subscribers</h3>
          <p style={{ color:'rgba(255,255,255,0.4)', fontSize:13, margin:'4px 0 0' }}>Each channel has its own private subscriber pool. Public viewers can see the list — only admin can edit.</p>
        </div>
        <a href="Lottery.html" target="_blank" rel="noreferrer" style={{ padding:'8px 14px', background:'rgba(192,132,252,0.15)', border:'1px solid rgba(192,132,252,0.3)', borderRadius:10, color:'#c084fc', fontSize:13, fontWeight:600, textDecoration:'none' }}>🎰 Open Lottery →</a>
      </div>

      {/* Channel picker */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:16, marginBottom:20 }}>
        <label style={{ fontSize:11, fontWeight:600, color:'rgba(255,255,255,0.4)', textTransform:'uppercase', letterSpacing:1, display:'block', marginBottom:8 }}>Select channel</label>
        <select value={selSno} onChange={e=>setSelSno(e.target.value)} style={{ width:'100%', padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:14, outline:'none' }}>
          {localChannels.map(c => {
            const cnt = (() => { try { return (JSON.parse(localStorage.getItem('pv_lot_subs_'+c.sno) || '[]')).length; } catch { return 0; } })();
            return <option key={c.sno} value={c.sno} style={{background:'#0e0e1a'}}>{c.name} — {cnt} sub{cnt!==1?'s':''}</option>;
          })}
        </select>
      </div>

      {ch && (
        <div style={{ background:`${accent}10`, border:`1px solid ${accent}33`, borderRadius:16, padding:'16px 20px', marginBottom:20, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:12 }}>
          <div>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:18, fontWeight:800, color:accent }}>{ch.name}</div>
            <div style={{ fontSize:12, color:'rgba(255,255,255,0.45)' }}>{ch.handle} · {ch.cat}</div>
          </div>
          <div style={{ textAlign:'right' }}>
            <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:32, fontWeight:900, color:accent, lineHeight:1 }}>{subs.length}</div>
            <div style={{ fontSize:11, color:'rgba(255,255,255,0.4)', textTransform:'uppercase', letterSpacing:1 }}>subscribers</div>
          </div>
        </div>
      )}

      {/* Add manual */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:14, padding:18, marginBottom:14 }}>
        <h4 style={{ color:'#c084fc', margin:'0 0 12px', fontSize:13, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase', letterSpacing:1 }}>+ Add One Subscriber</h4>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))', gap:10, marginBottom:10 }}>
          <AInput label="Name *"        value={manForm.name}         onChange={v=>setManForm({...manForm,name:v})}         placeholder="John Doe" />
          <AInput label="Handle"        value={manForm.handle}       onChange={v=>setManForm({...manForm,handle:v})}       placeholder="@johndoe" />
          <AInput label="Email"         value={manForm.email}        onChange={v=>setManForm({...manForm,email:v})}        placeholder="john@gmail.com" />
          <AInput label="Subscriber ID" value={manForm.subscriberId} onChange={v=>setManForm({...manForm,subscriberId:v})} placeholder="UCxxxxxx" />
          <AInput label="Phone"         value={manForm.phone}        onChange={v=>setManForm({...manForm,phone:v})}        placeholder="+91 9876543210" />
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center' }}>
          <ABtn onClick={addManual} variant="primary">+ Add Subscriber</ABtn>
          {msg && <span style={{ fontSize:13, color: msg.ok?'#4ade80':'#f87171' }}>{msg.text}</span>}
        </div>
      </div>

      {/* Bulk paste */}
      <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:14, padding:18, marginBottom:20 }}>
        <h4 style={{ color:'#22d3ee', margin:'0 0 8px', fontSize:13, fontFamily:"'Space Grotesk',sans-serif", textTransform:'uppercase', letterSpacing:1 }}>📝 Bulk Paste</h4>
        <p style={{ fontSize:12, color:'rgba(255,255,255,0.45)', margin:'0 0 10px' }}>One per line. Format: <code style={{ color:'#22d3ee' }}>Name, @handle, email, subscriberId, phone</code> — only Name is required.</p>
        <textarea value={paste} onChange={e=>setPaste(e.target.value)} rows={6} placeholder={"John Doe, @johndoe, john@gmail.com\nJane Smith\nAlex Kumar, @alex"} style={{ width:'100%', padding:'10px 14px', background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:10, color:'#e8e8f8', fontSize:13, outline:'none', fontFamily:'Inter,sans-serif', resize:'vertical', lineHeight:1.6, marginBottom:10 }}/>
        <div style={{ display:'flex', gap:10 }}>
          <ABtn onClick={addPaste} variant="primary">Add {paste.split('\n').filter(l=>l.trim()).length} Subscribers</ABtn>
          {subs.length>0 && <ABtn onClick={clearAll} variant="danger">Clear all subs for this channel</ABtn>}
        </div>
      </div>

      {/* List */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
        <h4 style={{ color:'#e8e8f8', margin:0, fontSize:14, fontFamily:"'Space Grotesk',sans-serif" }}>Current list ({subs.length})</h4>
        {subs.length>0 && <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search names..." style={{ padding:'6px 12px', background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:10, color:'#e8e8f8', fontSize:12, outline:'none', width:200 }}/>}
      </div>
      {subs.length === 0 ? (
        <div style={{ padding:'32px', textAlign:'center', color:'rgba(255,255,255,0.3)', fontSize:14, background:'rgba(255,255,255,0.02)', border:'1px dashed rgba(255,255,255,0.08)', borderRadius:14 }}>
          <div style={{ fontSize:32, marginBottom:10 }}>👥</div>
          No subscribers in this channel's pool yet — add some above
        </div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:6, maxHeight:400, overflowY:'auto' }}>
          {filtered.map((s,i) => (
            <div key={s.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 14px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:10 }}>
              <div style={{ width:26, height:26, borderRadius:8, background:`${accent}22`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11, fontWeight:700, color:accent, flexShrink:0 }}>{i+1}</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, fontWeight:600, color:'#e8e8f8' }}>{s.name}</div>
                <div style={{ fontSize:11, color:'rgba(255,255,255,0.3)', display:'flex', gap:10, flexWrap:'wrap', marginTop:2 }}>
                  {s.handle && <span>{s.handle}</span>}
                  {s.email && <span>{s.email}</span>}
                  {s.phone && <span>{s.phone}</span>}
                  {s.subscriberId && <span>ID: {s.subscriberId}</span>}
                </div>
              </div>
              <ABtn onClick={()=>delSub(s.id)} variant="danger" size="sm">×</ABtn>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// WEBSITES TAB — manage projects shown on the home page
// ============================================================
function WebsitesTab({ localWebsites, setLocalWebsites }) {
  const [editing, setEditing] = React.useState(null);
  const [form, setForm]       = React.useState({ id:'', title:'', url:'', description:'', tags:'', accent:'#22d3ee' });
  const [msg, setMsg]         = React.useState('');

  const startNew  = () => { setEditing('NEW'); setForm({ id:Date.now().toString(36), title:'', url:'', description:'', tags:'', accent:'#22d3ee' }); };
  const startEdit = (w) => { setEditing(w.id); setForm({ ...w, tags:(w.tags||[]).join(', ') }); };
  const cancel    = () => { setEditing(null); setForm({}); };
  const showMsg = (m) => { setMsg(m); setTimeout(()=>setMsg(''),2000); };

  const save = () => {
    if (!form.title || !form.url) { showMsg('Title & URL required'); return; }
    const cleaned = { ...form, tags: form.tags.split(',').map(s=>s.trim()).filter(Boolean) };
    const updated = editing === 'NEW' ? [...localWebsites, cleaned] : localWebsites.map(w => w.id===editing ? cleaned : w);
    setLocalWebsites(updated);
    setEditing(null); setForm({});
    showMsg('Saved ✓');
  };

  const del = (id) => {
    if (!confirm('Delete this website?')) return;
    setLocalWebsites(localWebsites.filter(w=>w.id!==id));
  };

  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
        <div>
          <h3 style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:20, fontWeight:800, color:'#f0f0f8', margin:0 }}>My Projects (Websites)</h3>
          <p style={{ color:'rgba(255,255,255,0.4)', fontSize:13, margin:'4px 0 0' }}>Live websites shown on the home page. Thumbnails are auto-generated from your URL.</p>
        </div>
        <div style={{ display:'flex', gap:10, alignItems:'center' }}>
          {msg && <span style={{ fontSize:13, color:'#4ade80' }}>{msg}</span>}
          <ABtn onClick={startNew} variant="primary">+ Add Website</ABtn>
        </div>
      </div>

      {editing && (
        <div style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.1)', borderRadius:16, padding:20, marginBottom:18 }}>
          <h4 style={{ color:'#22d3ee', margin:'0 0 14px', fontSize:14, fontFamily:"'Space Grotesk',sans-serif" }}>{editing==='NEW' ? 'New Website' : 'Edit Website'}</h4>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:12 }}>
            <AInput label="Title *" value={form.title||''} onChange={v=>setForm({...form,title:v})} placeholder="My Cool Project" />
            <AInput label="URL *" value={form.url||''} onChange={v=>setForm({...form,url:v})} placeholder="https://my-project.vercel.app" />
            <AInput label="Tags (comma separated)" value={form.tags||''} onChange={v=>setForm({...form,tags:v})} placeholder="React, Tailwind, Live" />
            <AInput label="Accent color" value={form.accent||'#22d3ee'} onChange={v=>setForm({...form,accent:v})} placeholder="#22d3ee" />
          </div>
          <ATextarea label="Short description" value={form.description||''} onChange={v=>setForm({...form,description:v})} rows={2} placeholder="What does this project do? (1-2 lines)" />
          <div style={{ display:'flex', gap:10, marginTop:14 }}>
            <ABtn onClick={save} variant="primary">Save Website</ABtn>
            <ABtn onClick={cancel} variant="ghost">Cancel</ABtn>
          </div>
        </div>
      )}

      {localWebsites.length === 0 ? (
        <div style={{ padding:'40px', textAlign:'center', color:'rgba(255,255,255,0.3)', fontSize:14, background:'rgba(255,255,255,0.02)', border:'1px dashed rgba(255,255,255,0.08)', borderRadius:14 }}>
          <div style={{ fontSize:36, marginBottom:10 }}>🌐</div>
          No websites yet — click "+ Add Website" above to feature your first project on the home page.
        </div>
      ) : (
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {localWebsites.map(w => (
            <div key={w.id} style={{ display:'flex', alignItems:'center', gap:14, padding:'12px 16px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:12 }}>
              <div style={{ width:48, height:36, borderRadius:8, background:`${w.accent||'#22d3ee'}22`, display:'flex', alignItems:'center', justifyContent:'center', fontSize:18, flexShrink:0 }}>🌐</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:14, fontWeight:700, color:'#e8e8f8' }}>{w.title}</div>
                <div style={{ fontSize:11, color:'rgba(255,255,255,0.35)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{w.url}</div>
              </div>
              <a href={safeUrl(w.url)} target="_blank" rel="noreferrer" style={{ padding:'5px 10px', background:'rgba(34,211,238,0.12)', border:'1px solid rgba(34,211,238,0.25)', borderRadius:8, fontSize:11, color:'#22d3ee', textDecoration:'none' }}>Open</a>
              <ABtn onClick={()=>startEdit(w)} variant="ghost" size="sm">Edit</ABtn>
              <ABtn onClick={()=>del(w.id)} variant="danger" size="sm">×</ABtn>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const startEdit = (p) => { setEditing(p.id); setForm({ ...p }); };
  const cancel    = () => { setEditing(null); setForm({}); };

  const save = () => {
    if (!form.title || !form.url) { showMsg('Title & URL required'); return; }

  const platformColor = (p) => ({
    'Medium':'#02b875','Blogger':'#fb923c','Patreon':'#f96854','Substack':'#ff6719','Quora':'#b92b27','LinkedIn':'#0a66c2','Other':'#c084fc'

          {msg && <span style={{ fontSize:13, color:'#4ade80' }}>{msg}</span>}

      {editing && (

            <AInput label="Date" value={form.date||''} onChange={v=>setForm({...form,date:v})} type="date" />

        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>

            return (
              <div key={p.id} style={{ display:'flex', alignItems:'center', gap:14, padding:'12px 16px', background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.07)', borderRadius:12 }}>
                <div style={{ minWidth:64, padding:'4px 10px', borderRadius:50, background:`${col}22`, border:`1px solid ${col}44`, color:col, fontSize:11, fontWeight:700, textAlign:'center' }}>{p.platform}</div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:'#e8e8f8' }}>{p.title}</div>
                  <div style={{ fontSize:11, color:'rgba(255,255,255,0.35)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.date} · {p.url}</div>
                </div>
                <a href={safeUrl(p.url)} target="_blank" rel="noreferrer" style={{ padding:'5px 10px', background:`${col}22`, border:`1px solid ${col}44`, borderRadius:8, fontSize:11, color:col, textDecoration:'none' }}>Open</a>
                <ABtn onClick={()=>startEdit(p)} variant="ghost" size="sm">Edit</ABtn>
                <ABtn onClick={()=>del(p.id)} variant="danger" size="sm">×</ABtn>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ---- DASHBOARD STATS ----
function DashStats({ channels, videos }) {
  const totalVideos = Object.values(videos).reduce((a,ch)=>a+Object.values(ch).reduce((b,vl)=>b+(vl.length||0),0),0);
  const cats = Array.from(new Set(channels.map(c=>c.cat)));
  const avgScore = Math.round(channels.reduce((a,c)=>a+c.score,0)/channels.length);
  const stats = [
    { label:'Channels', val: channels.length, color:'#22d3ee' },
    { label:'Playlists', val: channels.reduce((a,c)=>a+c.playlists.length,0), color:'#c084fc' },
    { label:'Videos Added', val: totalVideos, color:'#4ade80' },
    { label:'Categories', val: cats.length, color:'#facc15' },
    { label:'Avg Score', val: avgScore, color:'#fb923c' },
  ];
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))', gap:12, marginBottom:28 }}>
      {stats.map(s => (
        <div key={s.label} style={{ background:'rgba(255,255,255,0.03)', border:'1px solid rgba(255,255,255,0.08)', borderRadius:14, padding:'16px 18px' }}>
          <div style={{ fontFamily:"'Space Grotesk',sans-serif", fontSize:28, fontWeight:800, color: s.color }}>{s.val}</div>
          <div style={{ fontSize:12, color:'rgba(255,255,255,0.35)', textTransform:'uppercase', letterSpacing:1 }}>{s.label}</div>
        </div>
      ))}
    </div>
  );
}

        </div>

  );
}

// ---- BIGQUERY TAB — push every Supabase table to Google BigQuery ----
function BigQueryTab({ supabase, supabaseUrl, supabaseKey }) {
  const [busy, setBusy] = React.useState(false);
  const [res, setRes] = React.useState(null);
  const [runs, setRuns] = React.useState([]);
  const loadRuns = async () => {
    if (!supabase) return;
    const { data } = await supabase.from('bq_sync_runs').select('*').order('id', { ascending: false }).limit(8);
    setRuns(data || []);
  };
  React.useEffect(() => { loadRuns(); }, [supabase]);
  const push = async () => {
    if (!supabase) { setRes({ error: 'Connect Supabase first (⚙ Supabase tab).' }); return; }
    setBusy(true); setRes(null);
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { setRes({ error: 'Sign in with ☁ Cloud login (top bar) first.' }); return; }
      const r = await fetch(supabaseUrl.replace(/\/$/, '') + '/functions/v1/bigquery-sync', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token, apikey: supabaseKey },
        body: '{}'
      });
      const j = await r.json().catch(() => ({ error: 'HTTP ' + r.status }));
      setRes(j);
    } catch (e) {
      setRes({ error: 'Could not reach the bigquery-sync function. Is it deployed? (' + (e.message || e) + ')' });
    } finally { setBusy(false); loadRuns(); }
  };
  const box = { padding: 16, borderRadius: 12, background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(255,255,255,0.08)' };
  const pre = { margin: '8px 0 0', padding: 12, borderRadius: 8, background: 'rgba(0,0,0,0.45)', color: '#a8d8a8', fontSize: 12, overflowX: 'auto', lineHeight: 1.6 };
  const results = res && res.results ? Object.entries(res.results) : [];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div>
        <h2 style={{ fontFamily: "'Space Grotesk',sans-serif", margin: '0 0 6px' }}>☁ Google BigQuery</h2>
        <p style={{ color: 'rgba(255,255,255,0.5)', fontSize: 13, margin: 0, lineHeight: 1.6 }}>Copies every Supabase table (channels, playlists, videos, social, websites, posts, announcements, settings, subscribers, lottery, chat log) into the BigQuery dataset <code>pujiverse</code>. Each push replaces the BigQuery copy, so it always matches Supabase. Load jobs are free on BigQuery.</p>
      </div>
      <div style={{ ...box, display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
        <ABtn onClick={push} variant="primary">{busy ? 'Pushing…' : 'Push all data to BigQuery now'}</ABtn>
        <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.45)' }}>Needs ☁ Cloud login and the one-time setup below.</span>
      </div>
      {res && (
        <div style={{ ...box, borderColor: res.ok ? 'rgba(74,222,128,0.35)' : 'rgba(251,191,36,0.35)' }}>
          {res.error && <div style={{ color: '#fbbf24', fontSize: 13 }}>⚠ {res.error}</div>}
          {res.dataset && <div style={{ fontSize: 13, marginBottom: 8, color: res.ok ? '#4ade80' : '#fbbf24' }}>{res.ok ? '✓ Synced to ' : '⚠ Partly synced to '}<code>{res.dataset}</code></div>}
          {results.map(([t, r]) => (
            <div key={t} style={{ display: 'flex', justifyContent: 'space-between', gap: 12, fontSize: 12.5, padding: '4px 0', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
              <span>{t}</span>
              <span style={{ color: r.error ? '#f87171' : 'rgba(255,255,255,0.6)' }}>{r.error ? '✗ ' + r.error : r.skipped ? r.skipped : r.rows + ' rows'}</span>
            </div>
          ))}
        </div>
      )}
      <div style={box}>
        <b style={{ fontSize: 14 }}>One-time setup</b>
        <ol style={{ margin: '10px 0 0', paddingLeft: 18, fontSize: 13, lineHeight: 1.8, color: 'rgba(255,255,255,0.75)' }}>
          <li>In Google Cloud: pick or create a project and enable the <b>BigQuery API</b>.</li>
          <li>IAM → Service accounts → create one with roles <b>BigQuery Data Editor</b> and <b>BigQuery Job User</b>. Create a <b>JSON key</b> and download it.</li>
          <li>On your computer, in the project folder, run:
            <pre style={pre}>{`supabase login
supabase link --project-ref kykkbramlsychystjqba
supabase secrets set GCP_SA_KEY="$(cat service-account.json)" BQ_PROJECT_ID=your-gcp-project BQ_DATASET=pujiverse BQ_LOCATION=US CRON_SECRET=pick-a-long-random-string
supabase functions deploy bigquery-sync --no-verify-jwt`}</pre>
          </li>
          <li>Press <b>Push all data to BigQuery now</b> above.</li>
          <li>Optional: run <code>supabase/bigquery-schedule.sql</code> in Supabase for a daily automatic push, and <code>bigquery/views.sql</code> in BigQuery for ready-made reports.</li>
        </ol>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.45)', marginTop: 8 }}>The Google key stays inside Supabase as a secret. It is never in this website.</div>
      </div>
      <div style={box}>
        <b style={{ fontSize: 14 }}>Recent pushes</b>
        {runs.length === 0 ? <div style={{ fontSize: 12.5, color: 'rgba(255,255,255,0.45)', marginTop: 8 }}>No pushes yet.</div> : runs.map(r => (
          <div key={r.id} style={{ display: 'flex', justifyContent: 'space-between', gap: 12, fontSize: 12.5, padding: '6px 0', borderTop: '1px solid rgba(255,255,255,0.05)' }}>
            <span>{new Date(r.started_at).toLocaleString()} · {r.trigger}</span>
            <span style={{ color: r.ok ? '#4ade80' : r.finished_at ? '#f87171' : '#fbbf24' }}>{r.ok ? '✓ ok' : r.finished_at ? '✗ errors' : '… running'}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

            <a href="Lottery.html" title="Live subscriber lottery" style={{
              position:'fixed', right:24, bottom:96, zIndex:8000, display:'flex', alignItems:'center', gap:8,
              padding:'11px 17px', borderRadius:999, textDecoration:'none', fontWeight:800, fontSize:13,
              background:'linear-gradient(135deg,#c084fc,#f472b6)', color:'#0a0a15',
              boxShadow:'0 6px 22px rgba(192,132,252,0.5)'
            }}>🎰 Lottery</a>
          )}

          {view === 'login' && (
            <LoginModal supabase={supabase} onLogin={() => setView('admin')} onClose={() => setView('solar')} />
          )}

          {view === 'solar' && (
            <SolarSystem channels={channels} onOpenChannel={(ch)=>{ setActiveCh(ch); setView('channel'); }} onAdminClick={()=>setView('login')} />
          )}

          {view === 'channel' && activeCh && (
            <ChannelWorld ch={activeCh} data={data}
              onBack={()=>{ setView('solar'); setActiveCh(null); }}
              onOpenPlaylists={(ch)=>{ window.open(ch.url, '_blank'); }} />
          )}

          {view === 'hub' && (
            <SocialHub data={data} websites={localWebsites} onBack={()=>setView('solar')} />
          )}

          {view === 'classic' && (
            <PublicView
              onAdminClick={() => setView('login')}
              videos={localVideos}
              social={localSocial}
              websites={localWebsites}
              posts={localPosts}
              onBackToSpace={()=>setView('solar')}
              onOpenHub={()=>setView('hub')}
              channels={channels}
            />
          )}

          {view === 'admin' && (
            <AdminPanel
              onBack={() => { setView('solar'); reloadData(); }}
              supabase={supabase}
              supabaseUrl={supabaseUrl}
              supabaseKey={supabaseKey}
              setSupabaseUrl={setSupabaseUrl}
              setSupabaseKey={setSupabaseKey}
              onConnectSupabase={connectSupabase}
              localChannels={localChannels}
              setLocalChannels={setLocalChannels}
              localVideos={localVideos}
              setLocalVideos={setLocalVideos}
              localSocial={localSocial}
              setLocalSocial={setLocalSocial}
              localWebsites={localWebsites}
              setLocalWebsites={setLocalWebsites}
              localPosts={localPosts}
              setLocalPosts={setLocalPosts}
            />
          )}

          {(view==='solar' || view==='channel' || view==='hub' || view==='classic') && (
            <WelcomeModal supabase={supabase} />
          )}

          {/* AI guide: shared offline-ready widget loaded at the end of the page */}
        </>
      );
    }

    function NavChip({ children, active, onClick }) {
      return (
        <button onClick={onClick} style={{
          padding:'8px 14px', borderRadius:999, fontSize:13, fontWeight:600, cursor:'pointer',
          background: active ? 'rgba(34,211,238,0.18)' : 'rgba(12,12,24,0.8)',
          border:`1px solid ${active ? '#22d3ee' : 'rgba(255,255,255,0.12)'}`,
          color: active ? '#22d3ee' : 'rgba(255,255,255,0.7)', backdropFilter:'blur(8px)'
        }}>{children}</button>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  
</script>
<script src="js/pv-assistant.js" data-z="8600"></script>
</body>
</html>
