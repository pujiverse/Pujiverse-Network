<script>
(function () {
  var SB_URL = localStorage.getItem('pv_sb_url') || 'https://kykkbramlsychystjqba.supabase.co';
  var SB_KEY = localStorage.getItem('pv_sb_key') || 'sb_publishable_OcsI13nc3Xy5ak_BHAhJMA_lFhAf8EO';
  var P = window.PV_PROFILE || {};
  var CATC = window.PV_WEB_CAT_COLORS || {};
  var CAT_EMO = { 'Home': '🏠', 'Featured data platform': '📊', 'Web app & tool': '🛠️', 'Google AI Studio app': '✨', 'Academic': '🎓', 'Profile': '👤' };
  var SHORT_SLUG = { yt: 'youtube', ig: 'instagram', tt: 'tiktok', x: 'x', fb: 'facebook', li: null, pi: 'pinterest', me: 'medium', ss: 'substack', dc: 'discord', wa: 'whatsapp', qu: 'quora', dm: 'dailymotion' };
  var NO_ICON = { likee: 1, kwai: 1, moj: 1, trendo: 1 };

  // ---------- helpers ----------
  function readLocal(k) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return Array.isArray(v) && v.length ? v : null; } catch (e) { return null; } }
  function safeUrl(u) {
    if (!u) return '#';
    var s = String(u).trim();
    if (/^(https?:|mailto:|tel:)/i.test(s)) return s;
    if (/^(\/|\.|#)/.test(s) || /^[\w-]+\.html(#.*)?$/i.test(s)) return s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return '#';
    return 'https://' + s;
  }
  function host(u) { try { return new URL(u, location.href).hostname.replace(/^www\./, ''); } catch (e) { return ''; } }
  function hostPath(u) { try { var x = new URL(safeUrl(u), location.href); return (x.hostname.replace(/^www\./, '') + x.pathname).replace(/\/$/, ''); } catch (e) { return u; } }
  function isExternal(u) { return /^https?:/i.test(u) && host(u) !== location.hostname; }
  function darken(hex, f) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#1e1b4b';
    var n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgb(' + Math.round(r * f) + ',' + Math.round(g * f) + ',' + Math.round(b * f) + ')';
  }
  function abbr(p) { return String(p || '?').replace(/\(.*?\)/g, '').trim().split(/\s+/).map(function (w) { return w[0]; }).join('').slice(0, 2).toUpperCase(); }
  function el(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null) return;
      if (k === 'style') Object.keys(v).forEach(function (s) { if (s.indexOf('--') === 0) e.style.setProperty(s, v[s]); else e.style[s] = v[s]; });
      else if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x) e.append(x); });
      else e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return e;
  }

  // ---------- data ----------
  var channelCount = (P.stats && P.stats.channels) || 39;
  try { var lc = JSON.parse(localStorage.getItem('pv_channels') || 'null'); if (Array.isArray(lc) && lc.length > channelCount) channelCount = lc.length; } catch (e) {}
  var social = normSocial(readLocal('pv_social') || window.PV_SOCIAL || []);
  var sites = mergeSites(readLocal('pv_websites'));
  var home = null; try { home = JSON.parse(localStorage.getItem('pv_home') || 'null'); } catch (e) {}

  function normSocial(rows) {
    return rows.map(function (s) {
      return { group: s.group || s.group_name || 'Social', platform: s.platform || s.name || 'Link', handle: s.handle || s.username || '', url: s.url || s.link || '', color: s.color || s.brand_color || '#818cf8', icon: s.icon || s.icon_key || '' };
    }).filter(function (s) { return s.url && s.is_active !== false; });
  }
  function mergeSites(extra) {
    var out = (window.PV_WEBSITES || []).map(function (w) { return Object.assign({}, w); }), seen = {};
    out.forEach(function (s) { seen[hostPath(s.url)] = 1; });
    (extra || []).forEach(function (w) {
      var url = w.url || w.link; if (!url || w.is_live === false) return;
      var k = hostPath(url); if (seen[k]) return; seen[k] = 1;
      var cat = CATC[w.category] ? w.category : (w.tags && w.tags[0] && CATC[w.tags[0]]) ? w.tags[0] : 'Web app & tool';
      out.push({ id: w.id || k, cat: cat, title: w.title || w.name || host(url), url: url, description: w.description || w.desc || '', repo: w.repo || '', accent: w.accent || CATC[cat] });
    });
    return out;
  }
  function iconUrl(s) {
    var k = (s.icon || '').toLowerCase();
    if (!k || NO_ICON[k]) return null;
    if (k in SHORT_SLUG) return SHORT_SLUG[k] ? 'https://cdn.simpleicons.org/' + SHORT_SLUG[k] + '/ffffff' : null;
    return 'https://cdn.simpleicons.org/' + encodeURIComponent(k) + '/ffffff';
  }

  // ---------- items per view ----------
  function homeItems() {
    var base = [
      { key: 'youtube', label: 'YouTube', sub: channelCount + ' channels', img: 'https://cdn.simpleicons.org/youtube/ffffff', emo: '▶', color: '#ef4444', href: 'channels.html', enter: 'Entering the channel solar system…' },
      { key: 'about', label: 'About Me', sub: 'Profile · experience · skills', emo: '🧑‍🚀', color: '#f59e0b', route: 'about', enter: 'Opening my profile…' },
      { key: 'info', label: 'Personal Info', sub: 'Portfolio', emo: '🪪', color: '#22d3ee', href: (P.links && P.links.portfolio) || 'https://pujith-sakhamuri-portfolio.vercel.app/', enter: 'Opening my portfolio…' },
      { key: 'social', label: 'Social Hub', sub: social.length + ' accounts', emo: '🌐', color: '#c084fc', route: 'social', enter: 'Connecting to the social hub…' },
      { key: 'websites', label: 'Websites', sub: sites.length + ' live sites', emo: '💻', color: '#4ade80', route: 'websites', enter: 'Loading my websites…' }
    ];
    var ov = (home && home.planets) || {};
    return base.map(function (it) {
      var o = ov[it.key] || {};
      if (o.show === false) return null;
      var out = Object.assign({}, it);
      if (o.label) out.label = o.label;
      if (o.sub) out.sub = o.sub;
      if (o.color) out.color = o.color;
      if (o.emo && o.emo !== it.emo) { out.emo = o.emo; out.img = null; }
      if (it.key === 'info' && o.href) out.href = o.href;
      if (it.key === 'about' && o.href && o.href !== 'https://pujiverse.vercel.app/') { out.href = o.href; out.route = null; }
      return out;
    }).filter(Boolean);
  }
  function socialItems() {
    return social.map(function (s) {
      return { label: s.platform, sub: s.handle, group: s.group, color: s.color, img: iconUrl(s), txt: abbr(s.platform), href: s.url, newTab: true };
    });
  }
  function siteItems() {
    return sites.map(function (w) {
      var local = !isExternal(safeUrl(w.url));
      return { label: w.title, sub: w.description, group: w.cat, color: w.accent || CATC[w.cat] || '#4ade80', emo: CAT_EMO[w.cat] || '🪐', href: w.url, repo: w.repo, newTab: !local, urlText: host(safeUrl(w.url)) };
    });
  }
  function aboutItems() {
    var L = P.links || {};

  // ---------- zoom-into-planet transition ----------
  var zoom = document.getElementById('zoom'), zoomActive = false;
  function zoomInto(ball, it, done) {
    var r = ball.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;

  // ---------- live data published from the admin panel ----------
  function sbGet(table) {

      .then(function (r) { return r.ok ? r.json() : null; })

    if (res[1]) { sites = mergeSites(res[1]); changed = true; }

    function init() {
      W = innerWidth; H = innerHeight;
      c.width = W * dpr; c.height = H * dpr; c.style.width = W + 'px'; c.style.height = H + 'px';
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(850, W * H / 1900) * density);

      for (var i = 0; i < n; i++) {
        var big = Math.random() > 0.93;

<script type="text/babel">

      <TweakRadio label="Orbit tempo" value={t.tempo} options={['Still', 'Drift', 'Warp']} onChange={v => setTweak('tempo', v)} />
      <TweakSection label="Planets" />
      <TweakRadio label="Planet style" value={t.planets} options={['Glossy', 'Wireframe', 'Neon']} onChange={v => setTweak('planets', v)} />
    </TweaksPanel>
  );
}
ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<PVHomeTweaks />);
</script>
</body>
</html>
